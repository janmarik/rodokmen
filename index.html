<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodokmen Studio - Šlechtická Edice</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden select-none">

    <!-- Horní lišta s tlačítky -->
    <header class="bg-slate-900 border-b border-amber-500/30 px-6 py-3 flex items-center justify-between z-20 shadow-xl">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-lg">
                <i data-lucide="crown" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-white text-lg leading-tight font-cinzel tracking-wide">Rodokmen Studio</h1>
                <p class="text-xs text-amber-500/80">Královský zlatý & tmavomodrý plakát</p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <label class="cursor-pointer bg-slate-950 border border-amber-500/30 hover:bg-slate-800 text-amber-300 font-medium px-3.5 py-1.5 rounded-lg text-xs flex items-center space-x-2 transition-all shadow-sm">
                <i data-lucide="upload" class="w-4 h-4 text-amber-400"></i>
                <span>Načíst GEDCOM</span>
                <input type="file" id="gedcom-file-input" accept=".ged" class="hidden">
            </label>

            <button id="btn-export-gedcom" class="bg-slate-950 border border-amber-500/30 hover:bg-slate-800 text-amber-300 font-medium px-3.5 py-1.5 rounded-lg text-xs flex items-center space-x-2 transition-all shadow-sm">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span>Uložit GEDCOM</span>
            </button>

            <button id="btn-export-svg" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-1.5 rounded-lg text-xs flex items-center space-x-2 transition-all shadow-md">
                <i data-lucide="printer" class="w-4 h-4"></i>
                <span>Export SVG pro tisk</span>
            </button>
        </div>
    </header>

    <!-- Hlavní pracovní plocha -->
    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- Levý panel: Seznam osob -->
        <aside class="w-80 bg-slate-900 border-r border-amber-500/20 flex flex-col z-10 shadow-xl">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                <div class="font-semibold text-amber-400 text-xs tracking-wider flex items-center space-x-2 font-cinzel">
                    <span>SEZNAM OSOB</span>
                    <span id="person-count" class="bg-amber-500/20 text-amber-300 text-xs px-2 py-0.5 rounded-full font-mono border border-amber-500/30">0</span>
                </div>
                <button id="btn-add-person" class="text-xs bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/30 px-2.5 py-1 rounded-md flex items-center space-x-1 font-medium transition-all">
                    <i data-lucide="plus" class="w-3.5 h-3.5 text-amber-400"></i>
                    <span>Nová</span>
                </button>
            </div>

            <div class="p-3 border-b border-slate-800">
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-500"></i>
                    <input type="text" id="search-input" placeholder="Hledat jméno..." class="w-full pl-9 pr-3 py-1.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500/50 transition-all">
                </div>
            </div>

            <div id="person-list" class="flex-1 overflow-y-auto divide-y divide-slate-800/60"></div>
        </aside>

        <!-- Plátno s rodokmenem (Zoom a Drag & Drop) -->
        <main class="flex-1 relative overflow-hidden navy-grid-pattern" id="canvas-wrapper">
            <svg id="tree-svg" class="w-full h-full absolute inset-0 cursor-grab active:cursor-grabbing">
                <g id="viewport">
                    <g id="poster-header-group"></g>
                    <g id="lines-group"></g>
                    <g id="nodes-group"></g>
                </g>
            </svg>

            <!-- Tlačítka pro Zoom vpravo dole -->
            <div class="absolute bottom-6 right-6 flex flex-col bg-slate-900/90 backdrop-blur border border-amber-500/30 rounded-lg shadow-xl overflow-hidden">
                <button id="btn-zoom-in" class="p-2 hover:bg-slate-800 text-amber-400 transition-all" title="Přiblížit">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
                <button id="btn-zoom-out" class="p-2 hover:bg-slate-800 text-amber-400 transition-all border-t border-b border-amber-500/30" title="Oddálit">
                    <i data-lucide="minus" class="w-5 h-5"></i>
                </button>
                <button id="btn-zoom-reset" class="p-2 hover:bg-slate-800 text-amber-400 transition-all" title="Vycentrovat">
                    <i data-lucide="maximize-2" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Výzva při prázdném stavu -->
            <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                <div class="bg-slate-900/95 border border-amber-500/40 p-8 rounded-2xl shadow-2xl max-w-md text-center pointer-events-auto backdrop-blur">
                    <div class="w-12 h-12 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="crown" class="w-6 h-6"></i>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-1 font-cinzel">Váš rodokmen je prázdný</h3>
                    <p class="text-xs text-slate-400 mb-6 leading-relaxed">Načtěte soubor GEDCOM (.ged) nebo ručně vytvořte první osobu v rodokmenu.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Modální okno pro editaci osoby -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-slate-900 rounded-2xl shadow-2xl border border-amber-500/30 w-full max-w-lg overflow-hidden text-slate-200">
            <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-950">
                <h3 class="font-bold text-amber-400 text-base font-cinzel">Detail osoby</h3>
                <button id="btn-close-modal" class="text-slate-500 hover:text-slate-300 p-1 rounded-lg hover:bg-slate-800 transition-all">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                <input type="hidden" id="edit-id">

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Jméno</label>
                        <input type="text" id="edit-givenName" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500/50 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Příjmení</label>
                        <input type="text" id="edit-surname" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500/50 transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Pohlaví</label>
                        <select id="edit-sex" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500/50 transition-all">
                            <option value="M">Muž</option>
                            <option value="F">Žena</option>
                        </select>
                    </div>
                    <div id="maiden-name-container">
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Rodné příjmení</label>
                        <input type="text" id="edit-maidenName" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500/50 transition-all">
                    </div>
                </div>

                <!-- České selektory datumů -->
                <div class="space-y-3 pt-2 border-t border-slate-800">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Datum narození</label>
                        <div class="grid grid-cols-3 gap-2">
                            <select id="edit-birthDay" class="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500/50"></select>
                            <select id="edit-birthMonth" class="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500/50"></select>
                            <input type="number" id="edit-birthYear" placeholder="Rok" class="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500/50">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Datum úmrtí</label>
                        <div class="grid grid-cols-3 gap-2">
                            <select id="edit-deathDay" class="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500/50"></select>
                            <select id="edit-deathMonth" class="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500/50"></select>
                            <input type="number" id="edit-deathYear" placeholder="Rok" class="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500/50">
                        </div>
                    </div>
                </div>

                <!-- Tlačítka rodinných vazeb -->
                <div class="pt-4 border-t border-slate-800">
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Vazby a rodina</label>
                    <div class="flex flex-wrap gap-2">
                        <button id="btn-add-father" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs font-medium rounded-lg flex items-center space-x-1 transition-all border border-amber-500/20">
                            <i data-lucide="plus" class="w-3 h-3 text-amber-400"></i>
                            <span>Přidat otce</span>
                        </button>
                        <button id="btn-add-mother" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs font-medium rounded-lg flex items-center space-x-1 transition-all border border-amber-500/20">
                            <i data-lucide="plus" class="w-3 h-3 text-amber-400"></i>
                            <span>Přidat matku</span>
                        </button>
                        <button id="btn-add-spouse" class="px-3 py-1.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-medium rounded-lg flex items-center space-x-1 transition-all">
                            <i data-lucide="heart" class="w-3 h-3"></i>
                            <span id="label-add-spouse">Přidat manželku</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="px-6 py-4 bg-slate-950 border-t border-slate-800 flex items-center justify-between">
                <button id="btn-delete-person" class="px-3 py-1.5 text-red-400 hover:bg-red-500/10 text-xs font-medium rounded-lg transition-all flex items-center space-x-1">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    <span>Smazat osobu</span>
                </button>
                <div class="flex items-center space-x-2">
                    <button id="btn-cancel-modal" class="px-4 py-2 border border-slate-700 text-slate-300 hover:bg-slate-800 text-xs font-medium rounded-lg transition-all">
                        Zrušit
                    </button>
                    <button id="btn-save-modal" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-lg transition-all">
                        Uložit změny
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
