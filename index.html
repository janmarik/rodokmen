<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodokmen Studio - Plakátový Export</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;600&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }

        .canvas-container {
            background-image: radial-gradient(circle, #cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col overflow-hidden select-none">

    <!-- Top Navigation Header -->
    <header class="bg-slate-950 border-b border-slate-800 px-6 py-3 flex items-center justify-between z-10 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-lg">
                <i data-lucide="crown" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-white text-lg leading-tight font-cinzel tracking-wide">Rodokmen Studio</h1>
                <p class="text-xs text-amber-500/80">Generátor rodového plakátu přímé linie</p>
            </div>
        </div>

        <!-- Mode & Template Controls -->
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2 bg-slate-900 border border-slate-800 p-1 rounded-lg text-xs">
                <button id="btn-view-poster" onclick="setViewMode('poster')" class="px-3 py-1.5 rounded-md font-medium transition-all bg-amber-500 text-slate-950 font-semibold shadow">
                    Plakát Přímé Linie (Tisk)
                </button>
                <button id="btn-view-tree" onclick="setViewMode('tree')" class="px-3 py-1.5 rounded-md font-medium text-slate-400 hover:text-white transition-all">
                    Pracovní Strom (Editor)
                </button>
            </div>

            <div class="h-5 w-px bg-slate-800"></div>

            <label class="cursor-pointer bg-slate-900 border border-slate-700 hover:bg-slate-800 text-slate-200 font-medium px-3 py-1.5 rounded-lg text-xs flex items-center space-x-2 transition-all shadow-sm">
                <i data-lucide="upload" class="w-4 h-4 text-amber-400"></i>
                <span>Načíst GEDCOM</span>
                <input type="file" id="gedcom-input" accept=".ged" onchange="handleFileUpload(event)" class="hidden">
            </label>

            <button onclick="exportGedcom()" class="bg-slate-900 border border-slate-700 hover:bg-slate-800 text-slate-200 font-medium px-3 py-1.5 rounded-lg text-xs flex items-center space-x-2 transition-all shadow-sm">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span>Uložit GEDCOM</span>
            </button>

            <button onclick="exportSVG()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-1.5 rounded-lg text-xs flex items-center space-x-2 transition-all shadow-md">
                <i data-lucide="printer" class="w-4 h-4"></i>
                <span>Exportovat SVG pro tisk</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- Left Sidebar: People List -->
        <aside class="w-80 bg-slate-950 border-r border-slate-800 flex flex-col z-10 shadow-lg">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                <div class="font-semibold text-slate-200 text-xs tracking-wider flex items-center space-x-2">
                    <span>SEZNAM OSOB</span>
                    <span id="person-count" class="bg-amber-500/20 text-amber-400 text-xs px-2 py-0.5 rounded-full font-mono border border-amber-500/30">0</span>
                </div>
                <button onclick="createNewPerson()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1 rounded-md flex items-center space-x-1 font-medium transition-all">
                    <i data-lucide="plus" class="w-3.5 h-3.5 text-amber-400"></i>
                    <span>Nová</span>
                </button>
            </div>

            <div class="p-3 border-b border-slate-800">
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-500"></i>
                    <input type="text" id="search-input" oninput="renderPersonList()" placeholder="Hledat jméno..." class="w-full pl-9 pr-3 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500/50 transition-all">
                </div>
            </div>

            <div id="person-list" class="flex-1 overflow-y-auto divide-y divide-slate-900"></div>
        </aside>

        <!-- Canvas Area -->
        <main class="flex-1 relative overflow-hidden bg-slate-950" id="canvas-wrapper">
            <svg id="tree-svg" class="w-full h-full absolute inset-0 cursor-grab active:cursor-grabbing">
                <g id="viewport">
                    <g id="poster-background"></g>
                    <g id="lines-group"></g>
                    <g id="nodes-group"></g>
                </g>
            </svg>

            <!-- Navigation Controls -->
            <div class="absolute bottom-6 right-6 flex flex-col bg-slate-900/90 backdrop-blur border border-slate-800 rounded-lg shadow-xl overflow-hidden">
                <button onclick="zoomIn()" class="p-2 hover:bg-slate-800 text-slate-400 hover:text-white transition-all" title="Přiblížit">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
                <button onclick="zoomOut()" class="p-2 hover:bg-slate-800 text-slate-400 hover:text-white transition-all border-t border-b border-slate-800" title="Oddálit">
                    <i data-lucide="minus" class="w-5 h-5"></i>
                </button>
                <button onclick="resetZoom()" class="p-2 hover:bg-slate-800 text-slate-400 hover:text-white transition-all" title="Vycentrovat">
                    <i data-lucide="maximize-2" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Empty State Prompt -->
            <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                <div class="bg-slate-900/95 border border-amber-500/30 p-8 rounded-2xl shadow-2xl max-w-md text-center pointer-events-auto backdrop-blur">
                    <div class="w-12 h-12 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="folder-open" class="w-6 h-6"></i>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-1 font-cinzel">Žádný rodokmen k zobrazení</h3>
                    <p class="text-xs text-slate-400 mb-6 leading-relaxed">Nahrajte váš GEDCOM (.ged) soubor nebo vytvořte první osobu pro sestavení luxusního rodového plakátu přímé linie.</p>
                    <div class="flex items-center justify-center space-x-3">
                        <label class="cursor-pointer bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-xs flex items-center space-x-2 transition-all">
                            <i data-lucide="upload" class="w-4 h-4"></i>
                            <span>Načíst GEDCOM</span>
                            <input type="file" accept=".ged" onchange="handleFileUpload(event)" class="hidden">
                        </label>
                        <button onclick="createNewPerson()" class="bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-200 font-medium px-4 py-2 rounded-lg text-xs flex items-center space-x-2 transition-all">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            <span>Nová osoba</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 w-full max-w-lg overflow-hidden text-slate-200">
            <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-950">
                <h3 class="font-bold text-white text-base font-cinzel">Detail osoby</h3>
                <button onclick="closeModal()" class="text-slate-500 hover:text-slate-300 p-1 rounded-lg hover:bg-slate-800 transition-all">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                <input type="hidden" id="edit-id">

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Jméno</label>
                        <input type="text" id="edit-givenName" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500/50 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Příjmení</label>
                        <input type="text" id="edit-surname" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500/50 transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Pohlaví</label>
                        <select id="edit-sex" onchange="toggleMaidenNameField()" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500/50 transition-all">
                            <option value="M">Muž</option>
                            <option value="F">Žena</option>
                        </select>
                    </div>
                    <div id="maiden-name-container">
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Rodné příjmení</label>
                        <input type="text" id="edit-maidenName" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500/50 transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 pt-2 border-t border-slate-800">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Datum narození</label>
                        <input type="text" id="edit-birthDate" placeholder="např. 18 APR 1863" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500/50 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Datum úmrtí</label>
                        <input type="text" id="edit-deathDate" placeholder="např. 14 SEP 1920" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-amber-500/50 transition-all">
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-800">
                    <label class="block text-xs font-semibold text-slate-400 mb-2">Vazby a rodina</label>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="addRelative('father')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg flex items-center space-x-1 transition-all">
                            <i data-lucide="plus" class="w-3 h-3 text-amber-400"></i>
                            <span>Přidat otce</span>
                        </button>
                        <button onclick="addRelative('mother')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg flex items-center space-x-1 transition-all">
                            <i data-lucide="plus" class="w-3 h-3 text-amber-400"></i>
                            <span>Přidat matku</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="px-6 py-4 bg-slate-950 border-t border-slate-800 flex items-center justify-between">
                <button onclick="deleteCurrentPerson()" class="px-3 py-1.5 text-red-400 hover:bg-red-500/10 text-xs font-medium rounded-lg transition-all flex items-center space-x-1">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    <span>Smazat osobu</span>
                </button>
                <div class="flex items-center space-x-2">
                    <button onclick="closeModal()" class="px-4 py-2 border border-slate-700 text-slate-300 hover:bg-slate-800 text-xs font-medium rounded-lg transition-all">
                        Zrušit
                    </button>
                    <button onclick="savePersonModal()" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-lg transition-all">
                        Uložit změny
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Script Engine -->
    <script>
        let persons = {};
        let families = {};
        let activePersonId = null;
        let currentViewMode = 'poster';

        // Pan Zoom State
        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX = 0, startY = 0;

        // Node Dimensions for Poster Layout
        const CIRCLE_RADIUS = 50;
        const POSTER_WIDTH = 1800;
        const POSTER_HEIGHT = 1200;

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            setupPanZoom();
            updateEmptyState();
        });

        function toggleMaidenNameField() {
            const sex = document.getElementById('edit-sex').value;
            const container = document.getElementById('maiden-name-container');
            if (sex === 'F') {
                container.classList.remove('opacity-40', 'pointer-events-none');
            } else {
                container.classList.add('opacity-40', 'pointer-events-none');
            }
        }

        // GEDCOM Parser Engine
        function parseGedcom(text) {
            const lines = text.split(/\r?\n/);
            const newPersons = {};
            const newFamilies = {};
            let currentRecord = null;
            let currentType = null;

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                const match = line.match(/^(\d+)\s+(@[^@]+@|[^\s]+)\s*(.*)$/);
                if (!match) continue;

                const level = parseInt(match[1]);
                const tagOrId = match[2];
                const value = match[3];

                if (level === 0) {
                    if (value === 'INDI') {
                        currentType = 'INDI';
                        currentRecord = { id: tagOrId, givenName: '', surname: '', maidenName: '', sex: 'M', birthDate: '', deathDate: '', famc: null, fams: [] };
                        newPersons[tagOrId] = currentRecord;
                    } else if (value === 'FAM') {
                        currentType = 'FAM';
                        currentRecord = { id: tagOrId, husband: null, wife: null, children: [] };
                        newFamilies[tagOrId] = currentRecord;
                    } else {
                        currentType = null; currentRecord = null;
                    }
                } else if (currentRecord && level === 1) {
                    if (currentType === 'INDI') {
                        if (tagOrId === 'NAME') {
                            const nameMatch = value.match(/(.*?)\/(.*?)\//);
                            if (nameMatch) {
                                currentRecord.givenName = nameMatch[1].trim();
                                currentRecord.surname = nameMatch[2].trim();
                            } else {
                                currentRecord.givenName = value.trim();
                            }
                        } else if (tagOrId === 'SEX') currentRecord.sex = value.trim().toUpperCase();
                        else if (tagOrId === 'FAMC') currentRecord.famc = value.trim();
                        else if (tagOrId === 'FAMS') currentRecord.fams.push(value.trim());
                        else if (tagOrId === '_MAIDEN' || tagOrId === '_MARNM') currentRecord.maidenName = value.trim();
                    } else if (currentType === 'FAM') {
                        if (tagOrId === 'HUSB') currentRecord.husband = value.trim();
                        if (tagOrId === 'WIFE') currentRecord.wife = value.trim();
                        if (tagOrId === 'CHIL') currentRecord.children.push(value.trim());
                    }
                }
            }

            let lastTag = '';
            for (let line of lines) {
                line = line.trim();
                const match = line.match(/^(\d+)\s+([^\s]+)\s*(.*)$/);
                if (!match) continue;
                const level = parseInt(match[1]);
                const tag = match[2];
                const val = match[3];

                if (level === 0) currentRecord = newPersons[tag] || newFamilies[tag] || null;
                else if (level === 1) lastTag = tag;
                else if (level === 2 && tag === 'DATE' && currentRecord && currentRecord.givenName !== undefined) {
                    if (lastTag === 'BIRT') currentRecord.birthDate = val;
                    if (lastTag === 'DEAT') currentRecord.deathDate = val;
                }
            }

            Object.values(newPersons).forEach(p => {
                if (p.sex === 'F' && !p.maidenName && p.surname) p.maidenName = p.surname;
            });

            return { persons: newPersons, families: newFamilies };
        }

        function exportGedcom() {
            let ged = "0 HEAD\n1 SOUR RodokmenStudio\n1 GEDC\n2 VERS 5.5.1\n1 CHAR UTF-8\n";
            Object.values(persons).forEach(p => {
                ged += `0 ${p.id} INDI\n1 NAME ${p.givenName} /${p.surname}/\n`;
                if (p.sex) ged += `1 SEX ${p.sex}\n`;
                if (p.maidenName) ged += `1 _MAIDEN ${p.maidenName}\n`;
                if (p.birthDate) ged += `1 BIRT\n2 DATE ${p.birthDate}\n`;
                if (p.deathDate) ged += `1 DEAT\n2 DATE ${p.deathDate}\n`;
                if (p.famc) ged += `1 FAMC ${p.famc}\n`;
                (p.fams || []).forEach(f => { ged += `1 FAMS ${f}\n`; });
            });
            Object.values(families).forEach(f => {
                ged += `0 ${f.id} FAM\n`;
                if (f.husband) ged += `1 HUSB ${f.husband}\n`;
                if (f.wife) ged += `1 WIFE ${f.wife}\n`;
                (f.children || []).forEach(c => { ged += `1 CHIL ${c}\n`; });
            });
            ged += "0 TRLR\n";

            const blob = new Blob([ged], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'rodokmen.ged';
            link.click();
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const parsed = parseGedcom(e.target.result);
                persons = parsed.persons;
                families = parsed.families;
                const keys = Object.keys(persons);
                activePersonId = keys.length > 0 ? keys[0] : null;
                updateEmptyState();
                renderPersonList();
                renderTree();
                resetZoom();
            };
            reader.readAsText(file);
        }

        function renderPersonList() {
            const container = document.getElementById('person-list');
            const search = document.getElementById('search-input').value.toLowerCase();
            document.getElementById('person-count').innerText = Object.keys(persons).length;
            container.innerHTML = '';

            const sorted = Object.values(persons).sort((a,b) => {
                const nameA = `${a.surname} ${a.givenName}`.toLowerCase();
                const nameB = `${b.surname} ${b.givenName}`.toLowerCase();
                return nameA.localeCompare(nameB);
            });

            sorted.forEach(p => {
                const fullName = `${p.givenName} ${p.surname}`.toLowerCase();
                if (search && !fullName.includes(search)) return;

                const isActive = p.id === activePersonId;
                const div = document.createElement('div');
                div.className = `p-3 flex items-center justify-between cursor-pointer transition-all ${
                    isActive ? 'bg-slate-900 border-l-4 border-amber-500' : 'hover:bg-slate-900/50'
                }`;
                
                const dates = [p.birthDate, p.deathDate].filter(Boolean).join(' - ') || 'Bez datumu';
                const maiden = (p.sex === 'F' && p.maidenName) ? ` (${p.maidenName})` : '';

                div.innerHTML = `
                    <div class="overflow-hidden pr-2 flex-1" onclick="setActivePerson('${p.id}')">
                        <div class="font-medium text-slate-200 text-xs truncate">
                            ${p.givenName || 'Neznámé'} <span class="font-bold text-white">${p.surname || ''}</span>
                            <span class="text-xs text-amber-500/70 font-normal">${maiden}</span>
                        </div>
                        <div class="text-[10px] text-slate-500 truncate">${dates}</div>
                    </div>
                    <button onclick="openEditModal('${p.id}'); event.stopPropagation();" class="p-1 hover:bg-slate-800 rounded text-slate-500 hover:text-amber-400">
                        <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                    </button>
                `;
                container.appendChild(div);
            });
            lucide.createIcons();
        }

        function setActivePerson(id) {
            activePersonId = id;
            renderPersonList();
            renderTree();
        }

        function setViewMode(mode) {
            currentViewMode = mode;
            const btnPoster = document.getElementById('btn-view-poster');
            const btnTree = document.getElementById('btn-view-tree');
            if (mode === 'poster') {
                btnPoster.className = "px-3 py-1.5 rounded-md font-medium transition-all bg-amber-500 text-slate-950 font-semibold shadow";
                btnTree.className = "px-3 py-1.5 rounded-md font-medium text-slate-400 hover:text-white transition-all";
            } else {
                btnTree.className = "px-3 py-1.5 rounded-md font-medium transition-all bg-amber-500 text-slate-950 font-semibold shadow";
                btnPoster.className = "px-3 py-1.5 rounded-md font-medium text-slate-400 hover:text-white transition-all";
            }
            renderTree();
            resetZoom();
        }

        // --- POSTER RENDERER (ROYAL NAVY & GOLD) ---
        function renderTree() {
            const bgGroup = document.getElementById('poster-background');
            const linesGroup = document.getElementById('lines-group');
            const nodesGroup = document.getElementById('nodes-group');
            
            bgGroup.innerHTML = '';
            linesGroup.innerHTML = '';
            nodesGroup.innerHTML = '';

            if (!activePersonId || !persons[activePersonId]) return;

            // Extract ONLY DIRECT LINE ANCESTORS (Strict Filter)
            const directAncestors = getDirectAncestorsTree(activePersonId);

            if (currentViewMode === 'poster') {
                renderRoyalPosterLayout(directAncestors, bgGroup, linesGroup, nodesGroup);
            } else {
                renderStandardTreeLayout(linesGroup, nodesGroup);
            }
        }

        // Get strictly direct ancestors (child -> parents -> grandparents...)
        function getDirectAncestorsTree(rootId) {
            const root = persons[rootId];
            if (!root) return null;

            function buildNode(id, generation) {
                if (!id || !persons[id]) return null;
                const p = persons[id];

                let fatherNode = null;
                let motherNode = null;

                if (p.famc && families[p.famc]) {
                    const fam = families[p.famc];
                    if (fam.husband) fatherNode = buildNode(fam.husband, generation + 1);
                    if (fam.wife) motherNode = buildNode(fam.wife, generation + 1);
                }

                return {
                    id: p.id,
                    person: p,
                    generation,
                    father: fatherNode,
                    mother: motherNode
                };
            }

            return buildNode(rootId, 1);
        }

        // Render Royal Gold Poster Layout
        function renderRoyalPosterLayout(tree, bgGroup, linesGroup, nodesGroup) {
            const rootPerson = persons[activePersonId];
            const surnameTitle = (rootPerson.surname || 'MAŘÍKOVÝCH').toUpperCase();

            // Background & Golden Decorative Frame
            bgGroup.innerHTML = `
                <rect x="-100" y="-100" width="${POSTER_WIDTH + 200}" height="${POSTER_HEIGHT + 200}" fill="#090d16" />
                <rect x="30" y="30" width="${POSTER_WIDTH - 60}" height="${POSTER_HEIGHT - 60}" fill="none" stroke="#d97706" stroke-width="2" opacity="0.4" />
                <rect x="42" y="42" width="${POSTER_WIDTH - 84}" height="${POSTER_HEIGHT - 84}" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.6" />
                
                <!-- Decorative Header Compass Rose / Emblem -->
                <g transform="translate(${POSTER_WIDTH / 2}, 130)">
                    <circle cx="0" cy="0" r="28" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.8" />
                    <path d="M0 -34 L6 -10 L30 0 L6 10 L0 34 L-6 10 L-30 0 L-6 -10 Z" fill="#f59e0b" opacity="0.85" />
                    <circle cx="0" cy="0" r="4" fill="#090d16" />
                </g>

                <!-- Header Title -->
                <text x="${POSTER_WIDTH / 2}" y="210" text-anchor="middle" font-family="Cinzel, serif" font-size="34" font-weight="700" fill="#fef3c7" letter-spacing="4">RODOVÝ STROM RODINY ${surnameTitle}</text>
                <text x="${POSTER_WIDTH / 2}" y="240" text-anchor="middle" font-family="Cinzel, serif" font-size="14" font-weight="500" fill="#f59e0b" letter-spacing="2" opacity="0.8">PŘÍMÁ LINIE PŘEDKŮ | SESTAVENO V RODOKMEN STUDIO</text>
                <line x1="${POSTER_WIDTH / 2 - 180}" y1="260" x2="${POSTER_WIDTH / 2 + 180}" y2="260" stroke="#f59e0b" stroke-width="1" opacity="0.5" />
            `;

            // Calculate Positions for symmetrical tree
            const nodes = [];
            const connections = [];

            const rootX = POSTER_WIDTH / 2;
            const rootY = POSTER_HEIGHT - 180;

            // Position Root Badge
            nodes.push({ id: tree.id, person: tree.person, x: rootX, y: rootY, isRoot: true });

            // Layout Father (Left Wing) & Mother (Right Wing) recursively
            if (tree.father) {
                positionAncestorBranch(tree.father, rootX - 220, rootY - 180, -220, -140, 1, 'left', nodes, connections, rootX, rootY);
            }
            if (tree.mother) {
                positionAncestorBranch(tree.mother, rootX + 220, rootY - 180, 220, -140, 1, 'right', nodes, connections, rootX, rootY);
            }

            // Draw Connections (Elegant Gold Bezier Curves)
            connections.forEach(conn => {
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                const midY = (conn.y1 + conn.y2) / 2;
                const d = `M ${conn.x1} ${conn.y1} C ${conn.x1} ${midY}, ${conn.x2} ${midY}, ${conn.x2} ${conn.y2}`;
                
                path.setAttribute("d", d);
                path.setAttribute("fill", "none");
                path.setAttribute("stroke", "#d97706");
                path.setAttribute("stroke-width", "1.5");
                path.setAttribute("opacity", "0.6");
                linesGroup.appendChild(path);
            });

            // Draw Circular Medallions
            nodes.forEach(node => {
                const p = node.person;
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("transform", `translate(${node.x}, ${node.y})`);
                g.setAttribute("class", "cursor-pointer");
                g.onclick = () => openEditModal(node.id);

                const r = node.isRoot ? 58 : CIRCLE_RADIUS;

                // Outer Ring
                const circleOuter = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circleOuter.setAttribute("r", r);
                circleOuter.setAttribute("fill", "#0f172a");
                circleOuter.setAttribute("stroke", node.isRoot ? "#fbbf24" : "#f59e0b");
                circleOuter.setAttribute("stroke-width", node.isRoot ? "3" : "1.5");
                circleOuter.setAttribute("opacity", "0.95");
                g.appendChild(circleOuter);

                // Inner Decorative Ring
                const circleInner = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circleInner.setAttribute("r", r - 5);
                circleInner.setAttribute("fill", "none");
                circleInner.setAttribute("stroke", "#d97706");
                circleInner.setAttribute("stroke-width", "0.8");
                circleInner.setAttribute("stroke-dasharray", "3 2");
                circleInner.setAttribute("opacity", "0.6");
                g.appendChild(circleInner);

                // Gender Emblem Icon
                const emblem = document.createElementNS("http://www.w3.org/2000/svg", "text");
                emblem.setAttribute("x", "0");
                emblem.setAttribute("y", -r + 18);
                emblem.setAttribute("text-anchor", "middle");
                emblem.setAttribute("font-size", "10");
                emblem.setAttribute("fill", "#f59e0b");
                emblem.textContent = p.sex === 'F' ? '♀' : '♂';
                g.appendChild(emblem);

                // Full Name
                const nameText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                nameText.setAttribute("x", "0");
                nameText.setAttribute("y", "-4");
                nameText.setAttribute("text-anchor", "middle");
                nameText.setAttribute("font-family", "Cinzel, serif");
                nameText.setAttribute("font-size", node.isRoot ? "13" : "11");
                nameText.setAttribute("font-weight", "700");
                nameText.setAttribute("fill", "#fef3c7");
                
                let given = p.givenName || '';
                if (given.length > 14) given = given.substring(0, 12) + '…';
                nameText.textContent = given;
                g.appendChild(nameText);

                // Surname / Maiden Name
                const surnameText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                surnameText.setAttribute("x", "0");
                surnameText.setAttribute("y", "12");
                surnameText.setAttribute("text-anchor", "middle");
                surnameText.setAttribute("font-family", "Inter, sans-serif");
                surnameText.setAttribute("font-size", "10");
                surnameText.setAttribute("font-weight", "600");
                surnameText.setAttribute("fill", "#f59e0b");
                
                let surname = (p.sex === 'F' && p.maidenName) ? p.maidenName : p.surname;
                if (surname.length > 14) surname = surname.substring(0, 12) + '…';
                surnameText.textContent = surname;
                g.appendChild(surnameText);

                // Dates
                const dates = [p.birthDate ? `b.${p.birthDate.split(' ').pop()}` : '', p.deathDate ? `d.${p.deathDate.split(' ').pop()}` : ''].filter(Boolean).join(' ');
                if (dates) {
                    const dateText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    dateText.setAttribute("x", "0");
                    dateText.setAttribute("y", "26");
                    dateText.setAttribute("text-anchor", "middle");
                    dateText.setAttribute("font-size", "8");
                    dateText.setAttribute("fill", "#94a3b8");
                    dateText.textContent = dates;
                    g.appendChild(dateText);
                }

                nodesGroup.appendChild(g);
            });
        }

        // Recursive helper to branch ancestors in poster view
        function positionAncestorBranch(node, x, y, dx, dy, depth, side, nodes, connections, parentX, parentY) {
            if (!node) return;

            nodes.push({ id: node.id, person: node.person, x, y, isRoot: false });
            connections.push({ x1: parentX, y1: parentY - CIRCLE_RADIUS, x2: x, y2: y + CIRCLE_RADIUS });

            if (depth >= 4) return; // Cap at 4-5 generations for clean poster layout

            const nextDx = dx * 0.55;
            const nextDy = dy * 0.85;

            if (node.father) {
                positionAncestorBranch(node.father, x - Math.abs(nextDx), y + nextDy, nextDx, nextDy, depth + 1, side, nodes, connections, x, y);
            }
            if (node.mother) {
                positionAncestorBranch(node.mother, x + Math.abs(nextDx), y + nextDy, nextDx, nextDy, depth + 1, side, nodes, connections, x, y);
            }
        }

        // Fallback Standard Working Layout
        function renderStandardTreeLayout(linesGroup, nodesGroup) {
            const root = persons[activePersonId];
            if (!root) return;

            const node = document.createElementNS("http://www.w3.org/2000/svg", "g");
            node.setAttribute("transform", `translate(400, 300)`);
            node.innerHTML = `
                <rect width="200" height="80" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
                <text x="100" y="40" text-anchor="middle" fill="#ffffff" font-weight="bold">${root.givenName} ${root.surname}</text>
            `;
            nodesGroup.appendChild(node);
        }

        // Navigation Pan Zoom
        function setupPanZoom() {
            const svg = document.getElementById('tree-svg');
            svg.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'svg' || e.target.id === 'poster-background' || e.target.id === 'lines-group') {
                    isDragging = true;
                    startX = e.clientX - panX;
                    startY = e.clientY - panY;
                }
            });
            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    panX = e.clientX - startX;
                    panY = e.clientY - startY;
                    updateViewportTransform();
                }
            });
            window.addEventListener('mouseup', () => { isDragging = false; });
            svg.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
                scale = Math.min(Math.max(0.15, scale * zoomFactor), 3);
                updateViewportTransform();
            });
        }

        function updateViewportTransform() {
            document.getElementById('viewport').setAttribute('transform', `translate(${panX}, ${panY}) scale(${scale})`);
        }

        function zoomIn() { scale = Math.min(3, scale * 1.2); updateViewportTransform(); }
        function zoomOut() { scale = Math.max(0.15, scale / 1.2); updateViewportTransform(); }
        function resetZoom() {
            const wrapper = document.getElementById('canvas-wrapper');
            panX = wrapper.clientWidth / 2 - (POSTER_WIDTH * 0.4) / 2;
            panY = 40;
            scale = 0.42;
            updateViewportTransform();
        }

        function openEditModal(id) {
            const p = persons[id];
            if (!p) return;
            document.getElementById('edit-id').value = p.id;
            document.getElementById('edit-givenName').value = p.givenName || '';
            document.getElementById('edit-surname').value = p.surname || '';
            document.getElementById('edit-sex').value = p.sex || 'M';
            document.getElementById('edit-maidenName').value = p.maidenName || '';
            document.getElementById('edit-birthDate').value = p.birthDate || '';
            document.getElementById('edit-deathDate').value = p.deathDate || '';
            toggleMaidenNameField();
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('edit-modal').classList.add('hidden'); }

        function savePersonModal() {
            const id = document.getElementById('edit-id').value;
            if (!persons[id]) return;
            persons[id].givenName = document.getElementById('edit-givenName').value;
            persons[id].surname = document.getElementById('edit-surname').value;
            persons[id].sex = document.getElementById('edit-sex').value;
            persons[id].maidenName = document.getElementById('edit-maidenName').value;
            persons[id].birthDate = document.getElementById('edit-birthDate').value;
            persons[id].deathDate = document.getElementById('edit-deathDate').value;
            closeModal();
            renderPersonList();
            renderTree();
        }

        function createNewPerson() {
            const newId = `@I${Date.now()}@`;
            persons[newId] = { id: newId, givenName: 'Nová', surname: 'Osoba', sex: 'M', maidenName: '', birthDate: '', deathDate: '', famc: null, fams: [] };
            activePersonId = newId;
            updateEmptyState();
            renderPersonList();
            openEditModal(newId);
        }

        function deleteCurrentPerson() {
            const id = document.getElementById('edit-id').value;
            if (confirm('Opravdu chcete tuto osobu smazat?')) {
                delete persons[id];
                closeModal();
                const keys = Object.keys(persons);
                activePersonId = keys.length > 0 ? keys[0] : null;
                updateEmptyState();
                renderPersonList();
                renderTree();
            }
        }

        function addRelative(type) {
            const currentId = document.getElementById('edit-id').value;
            const newId = `@I${Date.now()}@`;
            persons[newId] = {
                id: newId,
                givenName: type === 'father' ? 'Otec' : 'Matka',
                surname: persons[currentId].surname || '',
                sex: type === 'mother' ? 'F' : 'M',
                maidenName: '', birthDate: '', deathDate: '', famc: null, fams: []
            };

            let famId = persons[currentId].famc;
            if (!famId) {
                famId = `@F${Date.now()}@`;
                families[famId] = { id: famId, husband: null, wife: null, children: [currentId] };
                persons[currentId].famc = famId;
            }

            if (type === 'father') families[famId].husband = newId;
            if (type === 'mother') families[famId].wife = newId;

            closeModal();
            renderPersonList();
            renderTree();
            openEditModal(newId);
        }

        function updateEmptyState() {
            document.getElementById('empty-state').style.display = Object.keys(persons).length === 0 ? 'flex' : 'none';
        }

        function exportSVG() {
            const svg = document.getElementById('tree-svg');
            const serializer = new XMLSerializer();
            let source = serializer.serializeToString(svg);
            if (!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
                source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
            }
            const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(source);
            const downloadLink = document.createElement("a");
            downloadLink.href = url;
            downloadLink.download = "rodokmen_plakat.svg";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
</body>
</html>
