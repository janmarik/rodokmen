<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zlatý Plakátový Rodokmen</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Elegant Serif & Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
        }
        .font-cinzel {
            font-family: 'Cinzel', serif;
        }
        .font-serif-title {
            font-family: 'Playfair Display', serif;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #161b22;
        }
        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }
    </style>
</head>
<div id="app" class="min-h-screen flex flex-col">
    <!-- Top Header -->
    <header class="bg-slate-900 border-b border-amber-500/30 px-6 py-4 flex flex-wrap justify-between items-center gap-4 sticky top-0 z-30 shadow-xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-600 via-amber-400 to-amber-200 flex items-center justify-center text-slate-950 font-bold shadow-lg shadow-amber-500/20">
                <i class="fa-solid font-cinzel text-lg">R</i>
            </div>
            <div>
                <h1 class="font-cinzel font-bold text-xl text-amber-200 tracking-wider">RODOKMEN PŘÍMÉ LINIE</h1>
                <p class="text-xs text-amber-400/70">Prémiový generátor rodokmenových plakátů</p>
            </div>
        </div>

        <!-- Action Controls -->
        <div class="flex flex-wrap items-center gap-3">
            <!-- GEDCOM Import -->
            <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/40 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-file-import"></i> Načíst GEDCOM
                <input type="file" id="gedcomInput" accept=".ged" class="hidden" onchange="handleGedcomUpload(event)">
            </label>

            <!-- GEDCOM Export -->
            <button onclick="exportGedcom()" class="bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/40 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-file-export"></i> Uložit GEDCOM
            </button>

            <!-- Reset / Clear -->
            <button onclick="confirmReset()" class="bg-red-950/40 hover:bg-red-900/60 text-red-300 border border-red-800/40 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                <i class="fa-solid fa-trash-can"></i> Vyčistit
            </button>

            <!-- Print / SVG Export -->
            <button onclick="exportSVG()" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-semibold px-4 py-2 rounded-lg text-sm transition flex items-center gap-2 shadow-lg shadow-amber-500/20">
                <i class="fa-solid fa-download"></i> Stáhnout SVG Plakát
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        
        <!-- Left Sidebar: Settings & Person List -->
        <aside class="w-full lg:w-96 bg-slate-900/90 border-r border-slate-800 p-5 flex flex-col gap-6 overflow-y-auto">
            
            <!-- Poster Customization -->
            <div class="bg-slate-800/60 border border-amber-500/20 rounded-xl p-4 space-y-4">
                <h2 class="font-cinzel font-semibold text-amber-300 text-sm tracking-wider flex items-center gap-2 border-b border-amber-500/20 pb-2">
                    <i class="fa-solid fa-sliders"></i> NASTAVENÍ PLAKÁTU
                </h2>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Titulní příjmení / Název rodokmenu</label>
                    <input type="text" id="familyTitleInput" value="NOVÁK" oninput="updatePosterTitle(this.value)"
                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-amber-200 text-sm focus:outline-none focus:border-amber-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Počet generací ke zobrazení</label>
                    <select id="generationDepthSelect" onchange="changeMaxGenerations(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-amber-200 text-sm focus:outline-none focus:border-amber-500 transition">
                        <option value="3">3 Generace (Rodiče, Prarodiče)</option>
                        <option value="4" selected>4 Generace (Prarodiče + Pra-prarodiče)</option>
                        <option value="5">5 Generací</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Kořenová osoba (Výchozí potomek)</label>
                    <select id="rootPersonSelect" onchange="changeRootPerson(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-amber-200 text-sm focus:outline-none focus:border-amber-500 transition">
                        <!-- Populated dynamically -->
                    </select>
                </div>
            </div>

            <!-- Quick Add Root Button -->
            <div class="flex gap-2">
                <button onclick="createNewRootPerson()" class="w-full bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/40 text-amber-300 font-medium py-2.5 rounded-xl text-sm transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> Přidat novou osobu
                </button>
            </div>

            <!-- List of All People -->
            <div class="flex-1 flex flex-col min-h-[300px]">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-cinzel font-semibold text-slate-300 text-xs tracking-wider">SEZNAM OSOB (<span id="personCount">0</span>)</h2>
                </div>
                <div id="peopleList" class="space-y-2 overflow-y-auto pr-1 flex-1 max-h-[500px]">
                    <!-- People cards inserted here -->
                </div>
            </div>
        </aside>

        <!-- Right Side: SVG Poster Preview Screen -->
        <main class="flex-1 bg-slate-950 p-4 lg:p-8 flex flex-col items-center justify-center overflow-auto relative">
            <div class="w-full h-full flex items-center justify-center min-h-[700px]">
                <!-- SVG Container -->
                <div id="posterContainer" class="shadow-2xl shadow-amber-950/40 rounded-lg border border-amber-900/30 overflow-hidden max-w-full max-h-full">
                    <!-- SVG will be generated here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Person Modal -->
    <div id="editModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-amber-500/40 rounded-2xl w-full max-w-xl p-6 shadow-2xl relative space-y-5 max-h-[90vh] overflow-y-auto">
            <!-- Modal Header -->
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-cinzel text-lg font-bold text-amber-300" id="modalTitle">Upravit osobu</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-amber-400 transition text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Person Edit Form -->
            <form id="personForm" onsubmit="savePerson(event)" class="space-y-4">
                <input type="hidden" id="editPersonId">

                <!-- Gender Switch -->
                <div class="flex gap-4 items-center bg-slate-950 p-2 rounded-xl border border-slate-800">
                    <span class="text-xs font-medium text-slate-400 ml-2">Pohlaví:</span>
                    <label class="flex items-center gap-2 text-sm text-slate-200 cursor-pointer">
                        <input type="radio" name="gender" value="M" id="genderM" class="text-amber-500 focus:ring-amber-500"> Muž
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-200 cursor-pointer">
                        <input type="radio" name="gender" value="F" id="genderF" class="text-amber-500 focus:ring-amber-500"> Žena
                    </label>
                </div>

                <!-- Names -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Jméno</label>
                        <input type="text" id="firstNameInput" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 text-sm focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Příjmení</label>
                        <input type="text" id="lastNameInput" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 text-sm focus:outline-none focus:border-amber-500">
                    </div>
                </div>

                <!-- Maiden Name for Women -->
                <div id="maidenNameContainer">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Rodné příjmení (u žen)</label>
                    <input type="text" id="maidenNameInput" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 text-sm focus:outline-none focus:border-amber-500 placeholder-slate-600" placeholder="Za svobodna">
                </div>

                <!-- Birth Date Selector (Czech Day, Month, Year) -->
                <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800/80 space-y-2">
                    <label class="block text-xs font-semibold text-amber-400">Datum narození</label>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <select id="birthDay" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
                                <option value="">Den</option>
                            </select>
                        </div>
                        <div>
                            <select id="birthMonth" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
                                <option value="">Měsíc</option>
                            </select>
                        </div>
                        <div>
                            <input type="number" id="birthYear" placeholder="Rok (např. 1925)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
                        </div>
                    </div>
                </div>

                <!-- Death Date Selector -->
                <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800/80 space-y-2">
                    <label class="block text-xs font-semibold text-amber-400">Datum úmrtí</label>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <select id="deathDay" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
                                <option value="">Den</option>
                            </select>
                        </div>
                        <div>
                            <select id="deathMonth" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
                                <option value="">Měsíc</option>
                            </select>
                        </div>
                        <div>
                            <input type="number" id="deathYear" placeholder="Rok (např. 1998)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
                        </div>
                    </div>
                </div>

                <!-- Family Relations Buttons -->
                <div class="pt-2 border-t border-slate-800 space-y-2">
                    <label class="block text-xs font-semibold text-slate-400">Rychlé propojení příbuzných</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" onclick="addParentForCurrent('M')" class="bg-slate-800 hover:bg-slate-700 text-amber-200 border border-amber-500/30 text-xs py-2 px-2 rounded-lg transition flex items-center justify-center gap-1">
                            <i class="fa-solid fa-mars"></i> Přidat otce
                        </button>
                        <button type="button" onclick="addParentForCurrent('F')" class="bg-slate-800 hover:bg-slate-700 text-amber-200 border border-amber-500/30 text-xs py-2 px-2 rounded-lg transition flex items-center justify-center gap-1">
                            <i class="fa-solid fa-venus"></i> Přidat matku
                        </button>
                        <button type="button" id="spouseButton" type="button" onclick="addSpouseForCurrent()" class="bg-slate-800 hover:bg-slate-700 text-amber-200 border border-amber-500/30 text-xs py-2 px-2 rounded-lg transition flex items-center justify-center gap-1">
                            <i class="fa-solid fa-ring"></i> Přidat partnera
                        </button>
                    </div>
                </div>

                <!-- Form Action Buttons -->
                <div class="flex justify-end gap-3 pt-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium rounded-lg transition">Zrušit</button>
                    <button type="submit" class="px-5 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-semibold text-sm rounded-lg shadow-lg shadow-amber-500/20 transition">Uložit osobu</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// --- CZECH MONTHS CONFIGURATION ---
const CZECH_MONTHS = [
    "Leden", "Únor", "Březen", "Duben", "Květen", "Červen",
    "Červenec", "Srpen", "ZÁŘÍ", "Říjen", "Listopad", "Prosinec"
];

// --- STATE MANAGEMENT ---
let state = {
    familyTitle: "NOVÁK",
    rootPersonId: null,
    maxGenerations: 4,
    people: {}
};

// Default setup on startup
window.onload = function() {
    populateDateDropdowns();
    initializeDefaultData();
    renderAll();
};

// --- INITIAL DATA SETUP ---
function initializeDefaultData() {
    // Check local storage or generate default direct lineage
    const p1 = createPersonObject("Jan", "Novák", "M", "", "15", "5", "1990", "", "", "");
    const p2 = createPersonObject("Josef", "Novák", "M", "", "10", "3", "1962", "", "", "");
    const p3 = createPersonObject("Marie", "Nováková", "F", "Dvořáková", "22", "8", "1965", "", "", "");
    
    // Grandparents
    const p4 = createPersonObject("Antonín", "Novák", "M", "", "4", "1", "1935", "12", "11", "2010");
    const p5 = createPersonObject("Anna", "Nováková", "F", "Svobodová", "18", "9", "1938", "5", "4", "2018");
    const p6 = createPersonObject("Karel", "Dvořák", "M", "", "30", "6", "1933", "1", "2", "2005");
    const p7 = createPersonObject("Eliška", "Dvořáková", "F", "Černá", "14", "12", "1937", "20", "7", "2021");

    // Link relations
    p1.fatherId = p2.id;
    p1.motherId = p3.id;

    p2.fatherId = p4.id;
    p2.motherId = p5.id;

    p3.fatherId = p6.id;
    p3.motherId = p7.id;

    state.people = {
        [p1.id]: p1,
        [p2.id]: p2,
        [p3.id]: p3,
        [p4.id]: p4,
        [p5.id]: p5,
        [p6.id]: p6,
        [p7.id]: p7
    };
    state.rootPersonId = p1.id;
}

function createPersonObject(firstName, lastName, gender, maidenName = "", bDay="", bMonth="", bYear="", dDay="", dMonth="", dYear="") {
    const id = 'ind_' + Math.random().toString(36).substr(2, 9);
    return {
        id: id,
        firstName: firstName || "",
        lastName: lastName || "",
        maidenName: maidenName || "",
        gender: gender || "M",
        birthDay: bDay,
        birthMonth: bMonth,
        birthYear: bYear,
        deathDay: dDay,
        deathMonth: dMonth,
        deathYear: dYear,
        fatherId: null,
        motherId: null,
        spouseId: null
    };
}

// Populate Czech Dropdowns for Days and Months
function populateDateDropdowns() {
    const daySelects = [document.getElementById('birthDay'), document.getElementById('deathDay')];
    const monthSelects = [document.getElementById('birthMonth'), document.getElementById('deathMonth')];

    daySelects.forEach(select => {
        for (let i = 1; i <= 31; i++) {
            const opt = document.createElement('option');
            opt.value = i.toString();
            opt.textContent = i;
            select.appendChild(opt);
        }
    });

    monthSelects.forEach(select => {
        CZECH_MONTHS.forEach((m, idx) => {
            const opt = document.createElement('option');
            opt.value = (idx + 1).toString();
            opt.textContent = m;
            select.appendChild(opt);
        });
    });
}

// --- RENDER FUNCTION ---
function renderAll() {
    renderPeopleList();
    renderRootSelect();
    renderPosterSVG();
}

function updatePosterTitle(val) {
    state.familyTitle = val.toUpperCase();
    renderPosterSVG();
}

function changeMaxGenerations(val) {
    state.maxGenerations = parseInt(val, 10);
    renderPosterSVG();
}

function changeRootPerson(id) {
    state.rootPersonId = id;
    renderPosterSVG();
}

// --- RENDER SIDEBAR LIST ---
function renderPeopleList() {
    const container = document.getElementById('peopleList');
    document.getElementById('personCount').textContent = Object.keys(state.people).length;
    container.innerHTML = '';

    Object.values(state.people).forEach(p => {
        const isRoot = p.id === state.rootPersonId;
        const card = document.createElement('div');
        card.className = `p-3 rounded-xl border flex items-center justify-between transition ${
            isRoot ? 'bg-amber-950/30 border-amber-500/60 shadow-md' : 'bg-slate-800/40 border-slate-700/60 hover:border-amber-500/30'
        }`;

        const fullName = `${p.firstName} ${p.lastName}` + (p.gender === 'F' && p.maidenName ? ` (${p.maidenName})` : '');
        const dates = formatDateSpan(p);

        card.innerHTML = `
            <div class="flex items-center gap-3 overflow-hidden">
                <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold ${
                    p.gender === 'M' ? 'bg-blue-950 text-blue-300 border border-blue-700/50' : 'bg-pink-950 text-pink-300 border border-pink-700/50'
                }">
                    ${p.gender === 'M' ? '♂' : '♀'}
                </div>
                <div class="truncate">
                    <div class="text-xs font-semibold text-slate-200 truncate">${fullName}</div>
                    <div class="text-[10px] text-slate-400">${dates || 'Bez datumu'}</div>
                </div>
            </div>
            <div class="flex items-center gap-1">
                <button onclick="openEditModal('${p.id}')" title="Upravit" class="w-7 h-7 rounded-lg bg-slate-700/60 hover:bg-amber-500/20 hover:text-amber-300 text-slate-300 text-xs flex items-center justify-center transition">
                    <i class="fa-solid fa-pen"></i>
                </button>
                <button onclick="deletePerson('${p.id}')" title="Smazat" class="w-7 h-7 rounded-lg bg-slate-700/60 hover:bg-red-500/20 hover:text-red-400 text-slate-300 text-xs flex items-center justify-center transition">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>
        `;
        container.appendChild(card);
    });
}

function renderRootSelect() {
    const select = document.getElementById('rootPersonSelect');
    select.innerHTML = '';
    Object.values(state.people).forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = `${p.firstName} ${p.lastName}` + (p.id === state.rootPersonId ? ' (Výchozí)' : '');
        if (p.id === state.rootPersonId) opt.selected = true;
        select.appendChild(opt);
    });
}

function formatDateSpan(p) {
    let b = p.birthYear ? `* ${p.birthYear}` : '';
    let d = p.deathYear ? `† ${p.deathYear}` : '';
    if (b && d) return `${b}  ${d}`;
    return b || d || '';
}

// --- PERSON EDITOR & RELATIONS ---
function openEditModal(personId = null) {
    const modal = document.getElementById('editModal');
    const form = document.getElementById('personForm');
    form.reset();

    if (personId && state.people[personId]) {
        const p = state.people[personId];
        document.getElementById('modalTitle').textContent = 'Upravit Osobu';
        document.getElementById('editPersonId').value = p.id;
        document.getElementById('firstNameInput').value = p.firstName;
        document.getElementById('lastNameInput').value = p.lastName;
        document.getElementById('maidenNameInput').value = p.maidenName || '';
        
        if (p.gender === 'F') document.getElementById('genderF').checked = true;
        else document.getElementById('genderM').checked = true;

        document.getElementById('birthDay').value = p.birthDay || '';
        document.getElementById('birthMonth').value = p.birthMonth || '';
        document.getElementById('birthYear').value = p.birthYear || '';
        document.getElementById('deathDay').value = p.deathDay || '';
        document.getElementById('deathMonth').value = p.deathMonth || '';
        document.getElementById('deathYear').value = p.deathYear || '';

        // Spouse Button Label Adjust
        document.getElementById('spouseButton').innerHTML = p.gender === 'F' ? '<i class="fa-solid fa-ring"></i> Přidat manžela' : '<i class="fa-solid fa-ring"></i> Přidat manželku';
    } else {
        document.getElementById('modalTitle').textContent = 'Nová Osoba';
        document.getElementById('editPersonId').value = '';
        document.getElementById('genderM').checked = true;
    }

    modal.classList.remove('hidden');
}

function closeModal() {
    document.getElementById('editModal').classList.add('hidden');
}

function savePerson(e) {
    e.preventDefault();
    const id = document.getElementById('editPersonId').value || ('ind_' + Math.random().toString(36).substr(2, 9));
    const gender = document.querySelector('input[name="gender"]:checked').value;

    const personObj = {
        id: id,
        firstName: document.getElementById('firstNameInput').value.trim(),
        lastName: document.getElementById('lastNameInput').value.trim(),
        maidenName: gender === 'F' ? document.getElementById('maidenNameInput').value.trim() : '',
        gender: gender,
        birthDay: document.getElementById('birthDay').value,
        birthMonth: document.getElementById('birthMonth').value,
        birthYear: document.getElementById('birthYear').value,
        deathDay: document.getElementById('deathDay').value,
        deathMonth: document.getElementById('deathMonth').value,
        deathYear: document.getElementById('deathYear').value,
        fatherId: state.people[id] ? state.people[id].fatherId : null,
        motherId: state.people[id] ? state.people[id].motherId : null,
        spouseId: state.people[id] ? state.people[id].spouseId : null,
    };

    state.people[id] = personObj;
    if (!state.rootPersonId) state.rootPersonId = id;

    closeModal();
    renderAll();
}

function createNewRootPerson() {
    openEditModal(null);
}

function addParentForCurrent(gender) {
    const currentId = document.getElementById('editPersonId').value;
    if (!currentId || !state.people[currentId]) return;

    const child = state.people[currentId];
    const newParent = createPersonObject(
        gender === 'M' ? 'Otec' : 'Matka',
        child.lastName,
        gender
    );

    state.people[newParent.id] = newParent;
    if (gender === 'M') child.fatherId = newParent.id;
    else child.motherId = newParent.id;

    closeModal();
    renderAll();
    openEditModal(newParent.id);
}

function addSpouseForCurrent() {
    const currentId = document.getElementById('editPersonId').value;
    if (!currentId || !state.people[currentId]) return;

    const p = state.people[currentId];
    const spouseGender = p.gender === 'M' ? 'F' : 'M';
    const newSpouse = createPersonObject(
        spouseGender === 'M' ? 'Manžel' : 'Manželka',
        p.lastName,
        spouseGender
    );

    state.people[newSpouse.id] = newSpouse;
    p.spouseId = newSpouse.id;
    newSpouse.spouseId = p.id;

    closeModal();
    renderAll();
    openEditModal(newSpouse.id);
}

function deletePerson(id) {
    if (Object.keys(state.people).length <= 1) {
        alert("Nelze smazat jedinou osobu v rodokmenu.");
        return;
    }

    // Clean links
    Object.values(state.people).forEach(p => {
        if (p.fatherId === id) p.fatherId = null;
        if (p.motherId === id) p.motherId = null;
        if (p.spouseId === id) p.spouseId = null;
    });

    delete state.people[id];

    if (state.rootPersonId === id) {
        state.rootPersonId = Object.keys(state.people)[0];
    }

    renderAll();
}

function confirmReset() {
    if (confirm("Opravdu chcete vymazat celý rodokmen a začít od znova?")) {
        const root = createPersonObject("Jan", "Novák", "M");
        state.people = { [root.id]: root };
        state.rootPersonId = root.id;
        renderAll();
    }
}

// --- DIRECT LINEAGE CALCULATOR ---
// Computes binary tree position for direct line ancestors
function buildDirectLineageTree(rootId, maxGens) {
    if (!rootId || !state.people[rootId]) return [];

    const nodes = [];

    // Helper recursive tree traverse
    function traverse(personId, gen, xOffset, xWidth) {
        if (!personId || gen > maxGens || !state.people[personId]) return;

        const person = state.people[personId];
        nodes.push({
            person: person,
            gen: gen, // 1 = root, 2 = parents, 3 = grandparents, etc.
            xRatio: xOffset,
            widthRatio: xWidth
        });

        if (gen < maxGens) {
            const halfWidth = xWidth / 2;
            if (person.fatherId) traverse(person.fatherId, gen + 1, xOffset - halfWidth / 2, halfWidth);
            if (person.motherId) traverse(person.motherId, gen + 1, xOffset + halfWidth / 2, halfWidth);
        }
    }

    traverse(rootId, 1, 0.5, 1.0);
    return nodes;
}

// --- GOLD SVG POSTER GENERATOR ---
function renderPosterSVG() {
    const container = document.getElementById('posterContainer');
    const width = 1200;
    const height = 1600;

    const nodes = buildDirectLineageTree(state.rootPersonId, state.maxGenerations);

    // Dynamic vertical placement by generation
    const genYMap = {
        1: 1350, // Child at bottom center
        2: 1080, // Parents
        3: 780,  // Grandparents
        4: 500,  // Great-Grandparents
        5: 280   // Great-Great-Grandparents
    };

    let svg = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" class="w-full h-auto max-h-[85vh] block" style="background-color: #070a0f;">
        <defs>
            <!-- Background Gradient -->
            <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
                <stop offset="0%" stop-color="#1e1b18" />
                <stop offset="60%" stop-color="#0b0e14" />
                <stop offset="100%" stop-color="#040609" />
            </radialGradient>

            <!-- Gold Foil Metallic Gradient -->
            <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#bf953f" />
                <stop offset="25%" stop-color="#fcf6ba" />
                <stop offset="50%" stop-color="#b38728" />
                <stop offset="75%" stop-color="#fbf5b7" />
                <stop offset="100%" stop-color="#aa771c" />
            </linearGradient>

            <linearGradient id="goldLine" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#d4af37" stop-opacity="0.8" />
                <stop offset="100%" stop-color="#aa771c" stop-opacity="0.2" />
            </linearGradient>

            <!-- Drop Shadows -->
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
            </filter>
        </defs>

        <!-- Canvas Background -->
        <rect width="${width}" height="${height}" fill="url(#bgGlow)" />

        <!-- Luxury Outer Border Frame -->
        <rect x="35" y="35" width="${width - 70}" height="${height - 70}" fill="none" stroke="url(#goldGradient)" stroke-width="3" rx="8" />
        <rect x="47" y="47" width="${width - 94}" height="${height - 94}" fill="none" stroke="url(#goldGradient)" stroke-width="1" stroke-dasharray="8 4" opacity="0.6" rx="6" />

        <!-- Decorative Frame Corner Ornaments -->
        ${renderCornerOrnaments(width, height)}

        <!-- TOP EMBLEM & HEADER -->
        <g transform="translate(${width / 2}, 140)">
            <!-- Compass Rose / Emblem Center -->
            <g transform="scale(0.85)">
                <path d="M 0 -45 L 9 -12 L 45 0 L 9 12 L 0 45 L -9 12 L -45 0 L -9 -12 Z" fill="url(#goldGradient)" />
                <path d="M 0 -45 L 0 0 L 45 0 Z M 0 45 L 0 0 L -45 0 Z" fill="#aa771c" opacity="0.4" />
                <circle r="6" fill="#fcf6ba" />
            </g>

            <!-- Main Title Banner -->
            <text y="75" text-anchor="middle" font-family="'Cinzel', serif" font-size="20" font-weight="600" fill="#d4af37" letter-spacing="6" opacity="0.9">RODOVÝ STROM RODINY</text>
            <text y="125" text-anchor="middle" font-family="'Playfair Display', serif" font-size="44" font-weight="700" fill="url(#goldGradient)" letter-spacing="4" filter="url(#shadow)">${escapeHtml(state.familyTitle)}</text>
            <line x1="-180" y1="145" x2="180" y2="145" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.7" />
            <circle cx="0" cy="145" r="3.5" fill="#fcf6ba" />
        </g>
    `;

    // Calculate Coordinates for Connections & Medallions
    const calculatedNodes = nodes.map(node => {
        const cx = node.xRatio * (width - 240) + 120;
        const cy = genYMap[node.gen] || 200;
        return { ...node, cx, cy };
    });

    // 1. Draw Elegant Connecting Lines First
    calculatedNodes.forEach(node => {
        if (node.person.fatherId) {
            const fatherNode = calculatedNodes.find(n => n.person.id === node.person.fatherId);
            if (fatherNode) {
                svg += `<path d="M ${node.cx} ${node.cy - 35} C ${node.cx} ${(node.cy + fatherNode.cy)/2}, ${fatherNode.cx} ${(node.cy + fatherNode.cy)/2}, ${fatherNode.cx} ${fatherNode.cy + 35}" fill="none" stroke="url(#goldLine)" stroke-width="1.8" />`;
            }
        }
        if (node.person.motherId) {
            const motherNode = calculatedNodes.find(n => n.person.id === node.person.motherId);
            if (motherNode) {
                svg += `<path d="M ${node.cx} ${node.cy - 35} C ${node.cx} ${(node.cy + motherNode.cy)/2}, ${motherNode.cx} ${(node.cy + motherNode.cy)/2}, ${motherNode.cx} ${motherNode.cy + 35}" fill="none" stroke="url(#goldLine)" stroke-width="1.8" />`;
            }
        }
    });

    // 2. Render Cards/Medallions for Ancestors
    calculatedNodes.forEach(node => {
        svg += renderPersonMedallion(node.person, node.cx, node.cy, node.gen);
    });

    // Close SVG
    svg += `</svg>`;
    container.innerHTML = svg;
}

// Render Decorative Corner Elements
function renderCornerOrnaments(w, h) {
    const corners = [
        { x: 55, y: 55, rot: 0 },
        { x: w - 55, y: 55, rot: 90 },
        { x: w - 55, y: h - 55, rot: 180 },
        { x: 55, y: h - 55, rot: 270 }
    ];

    return corners.map(c => `
        <g transform="translate(${c.x}, ${c.y}) rotate(${c.rot})">
            <path d="M 0 0 L 25 0 L 25 4 L 4 4 L 4 25 L 0 25 Z" fill="url(#goldGradient)" />
            <circle cx="12" cy="12" r="2.5" fill="#fcf6ba" />
        </g>
    `).join('');
}

// Render Individual Royal Medallion/Card
function renderPersonMedallion(person, cx, cy, gen) {
    const isRoot = gen === 1;
    const cardWidth = isRoot ? 230 : (gen === 2 ? 200 : (gen === 3 ? 170 : 135));
    const cardHeight = isRoot ? 85 : (gen === 2 ? 75 : (gen === 3 ? 65 : 55));
    const rx = 12;

    const firstName = person.firstName || '';
    const lastName = person.lastName || '';
    const maidenName = (person.gender === 'F' && person.maidenName) ? `(${person.maidenName})` : '';

    // Czech Date Formatting
    const dates = formatDateSpan(person);

    // Font Sizes based on Generation Depth
    const nameSize = isRoot ? 16 : (gen === 2 ? 14 : (gen === 3 ? 12 : 10));
    const dateSize = isRoot ? 11 : (gen === 2 ? 10 : (gen === 3 ? 9 : 8));

    return `
    <g transform="translate(${cx}, ${cy})" class="cursor-pointer" onclick="openEditModal('${person.id}')" filter="url(#shadow)">
        <!-- Card Background -->
        <rect x="-${cardWidth/2}" y="-${cardHeight/2}" width="${cardWidth}" height="${cardHeight}" rx="${rx}" 
            fill="#0f141c" stroke="url(#goldGradient)" stroke-width="${isRoot ? 2.5 : 1.5}" />

        <!-- Accent Line -->
        <line x1="-${cardWidth/2 - 15}" y1="${cardHeight/2 - 16}" x2="${cardWidth/2 - 15}" y2="${cardHeight/2 - 16}" stroke="url(#goldGradient)" stroke-width="0.8" opacity="0.5" />

        <!-- Gender Symbol Small Emblem -->
        <circle cx="-${cardWidth/2 - 16}" cy="0" r="8" fill="#18202c" stroke="url(#goldGradient)" stroke-width="1"/>
        <text x="-${cardWidth/2 - 16}" y="3.5" text-anchor="middle" font-size="9" fill="${person.gender === 'M' ? '#93c5fd' : '#f472b6'}" font-weight="bold">
            ${person.gender === 'M' ? '♂' : '♀'}
        </text>

        <!-- Person Name -->
        <text x="6" y="-${cardHeight/2 - (nameSize + 10)}" text-anchor="middle" font-family="'Playfair Display', serif" font-size="${nameSize}" font-weight="700" fill="#fcf6ba">
            ${escapeHtml(firstName)} ${escapeHtml(lastName)}
        </text>

        <!-- Maiden Name if Female -->
        ${maidenName ? `
        <text x="6" y="${isRoot ? 4 : 2}" text-anchor="middle" font-family="'Inter', sans-serif" font-size="${dateSize}" font-style="italic" fill="#d4af37" opacity="0.9">
            ${escapeHtml(maidenName)}
        </text>
        ` : ''}

        <!-- Dates (Birth - Death) -->
        <text x="6" y="${cardHeight/2 - 8}" text-anchor="middle" font-family="'Inter', sans-serif" font-size="${dateSize}" font-weight="400" fill="#94a3b8">
            ${escapeHtml(dates)}
        </text>
    </g>
    `;
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// --- GEDCOM PARSER & EXPORT ---
function handleGedcomUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        parseGEDCOM(e.target.result);
    };
    reader.readAsText(file);
}

function parseGEDCOM(text) {
    const lines = text.split(/\r?\n/);
    const parsedPeople = {};
    const families = {};

    let currentInd = null;
    let currentFam = null;

    lines.forEach(line => {
        const parts = line.trim().split(' ');
        if (parts.length < 2) return;

        const level = parts[0];
        const tagOrId = parts[1];
        const rest = parts.slice(2).join(' ');

        if (level === '0') {
            if (rest === 'INDI') {
                currentInd = createPersonObject("", "", "M");
                currentInd.id = tagOrId.replace(/@/g, '');
                parsedPeople[currentInd.id] = currentInd;
                currentFam = null;
            } else if (rest === 'FAM') {
                currentFam = { id: tagOrId.replace(/@/g, ''), husband: null, wife: null, children: [] };
                families[currentFam.id] = currentFam;
                currentInd = null;
            }
        } else if (currentInd) {
            if (tagOrId === 'GIVN') currentInd.firstName = rest;
            else if (tagOrId === 'SURN') currentInd.lastName = rest;
            else if (tagOrId === '_MARNM' || tagOrId === '_MAIDEN') currentInd.maidenName = rest;
            else if (tagOrId === 'SEX') currentInd.gender = rest === 'F' ? 'F' : 'M';
            else if (tagOrId === 'DATE') {
                // Approximate Date Extractor
                const yearMatch = rest.match(/\b\d{4}\b/);
                if (yearMatch) {
                    if (currentInd._lastTag === 'BIRT') currentInd.birthYear = yearMatch[0];
                    if (currentInd._lastTag === 'DEAT') currentInd.deathYear = yearMatch[0];
                }
            } else if (tagOrId === 'BIRT' || tagOrId === 'DEAT') {
                currentInd._lastTag = tagOrId;
            }
        } else if (currentFam) {
            if (tagOrId === 'HUSB') currentFam.husband = rest.replace(/@/g, '');
            else if (tagOrId === 'WIFE') currentFam.wife = rest.replace(/@/g, '');
            else if (tagOrId === 'CHIL') currentFam.children.push(rest.replace(/@/g, ''));
        }
    });

    // Link parents to children
    Object.values(families).forEach(fam => {
        fam.children.forEach(childId => {
            if (parsedPeople[childId]) {
                if (fam.husband) parsedPeople[childId].fatherId = fam.husband;
                if (fam.wife) parsedPeople[childId].motherId = fam.wife;
            }
        });
        if (fam.husband && fam.wife && parsedPeople[fam.husband]) {
            parsedPeople[fam.husband].spouseId = fam.wife;
            if (parsedPeople[fam.wife]) parsedPeople[fam.wife].spouseId = fam.husband;
        }
    });

    if (Object.keys(parsedPeople).length > 0) {
        state.people = parsedPeople;
        state.rootPersonId = Object.keys(parsedPeople)[0];
        renderAll();
        alert(`GEDCOM soubor úspěšně načten (${Object.keys(parsedPeople).length} osob).`);
    } else {
        alert("Nepodařilo se načíst žádné osoby z GEDCOM souboru.");
    }
}

function exportGedcom() {
    let ged = "0 HEAD\n1 SOUR GOLD_POSTER_APP\n1 GEDC\n2 VERS 5.5.1\n2 FORM LINEAGE\n1 CHAR UTF-8\n";

    Object.values(state.people).forEach(p => {
        ged += `0 @${p.id}@ INDI\n`;
        ged += `1 NAME ${p.firstName} /${p.lastName}/\n`;
        if (p.firstName) ged += `2 GIVN ${p.firstName}\n`;
        if (p.lastName) ged += `2 SURN ${p.lastName}\n`;
        if (p.maidenName) ged += `2 _MAIDEN ${p.maidenName}\n`;
        ged += `1 SEX ${p.gender}\n`;
        if (p.birthYear) {
            ged += `1 BIRT\n2 DATE ${p.birthDay || ''} ${p.birthMonth ? CZECH_MONTHS[parseInt(p.birthMonth)-1] : ''} ${p.birthYear}\n`;
        }
        if (p.deathYear) {
            ged += `1 DEAT\n2 DATE ${p.deathDay || ''} ${p.deathMonth ? CZECH_MONTHS[parseInt(p.deathMonth)-1] : ''} ${p.deathYear}\n`;
        }
        if (p.fatherId || p.motherId) {
            ged += `1 FAMC @FAM_${p.fatherId || 'X'}_${p.motherId || 'Y'}@\n`;
        }
    });

    ged += "0 TLR\n";

    const blob = new Blob([ged], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `Rodokmen_${state.familyTitle || 'Plakat'}.ged`;
    link.click();
}

// Export SVG for High Quality Poster Printing
function exportSVG() {
    const container = document.getElementById('posterContainer');
    const svgContent = container.innerHTML;

    const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });

    link.download = `Plakat_Rodokmen_${state.familyTitle || 'Rodina'}.svg`;
    link.click();
}
