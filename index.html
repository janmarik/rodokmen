<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodokmen Studio - Finální Přesné Rozvržení</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }

        .canvas-bg {
            background-color: #fafafa;
            background-image: radial-gradient(#e5e7eb 1.2px, transparent 1.2px);
            background-size: 24px 24px;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden select-none">

    <!-- Top Navigation Header -->
    <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between z-20 shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-slate-900 text-white rounded-lg">
                <i data-lucide="network" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-slate-900 text-lg leading-tight">Rodokmen Studio</h1>
                <p class="text-xs text-slate-500">Matematicky přesný generační strom</p>
            </div>
        </div>

        <!-- Mode & Actions -->
        <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-lg text-xs">
                <button id="btn-mode-tree" onclick="setAppMode('tree')" class="px-3 py-1.5 rounded-md font-semibold transition-all bg-white shadow-sm text-slate-900">
                    Pracovní Strom
                </button>
                <button id="btn-mode-poster" onclick="setAppMode('poster')" class="px-3 py-1.5 rounded-md font-medium text-slate-600 hover:text-slate-900 transition-all">
                    Zlatý Plakát (Tisk)
                </button>
            </div>

            <div class="h-5 w-px bg-slate-200"></div>

            <label class="cursor-pointer bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium px-3.5 py-1.5 rounded-lg text-xs flex items-center space-x-2 transition-all shadow-sm">
                <i data-lucide="upload" class="w-4 h-4 text-slate-500"></i>
                <span>Načíst GEDCOM</span>
                <input type="file" accept=".ged" onchange="handleFileUpload(event)" class="hidden">
            </label>

            <button onclick="exportGedcom()" class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium px-3.5 py-1.5 rounded-lg text-xs flex items-center space-x-2 transition-all shadow-sm">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span>Uložit GEDCOM</span>
            </button>

            <button onclick="exportSVG()" class="bg-slate-900 hover:bg-slate-800 text-white font-semibold px-4 py-1.5 rounded-lg text-xs flex items-center space-x-2 transition-all shadow-md">
                <i data-lucide="printer" class="w-4 h-4"></i>
                <span>Export SVG</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- Left Sidebar: People List -->
        <aside class="w-80 bg-white border-r border-slate-200 flex flex-col z-10 shadow-sm">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                <div class="font-semibold text-slate-700 text-xs tracking-wider flex items-center space-x-2">
                    <span>OSOBY V RODOKMENU</span>
                    <span id="person-count" class="bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded-full font-mono">0</span>
                </div>
                <button onclick="createNewPerson()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-md flex items-center space-x-1 font-medium transition-all">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    <span>Nová</span>
                </button>
            </div>

            <div class="p-3 border-b border-slate-100">
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
                    <input type="text" id="search-input" oninput="renderPersonList()" placeholder="Hledat jméno..." class="w-full pl-9 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-slate-400 transition-all">
                </div>
            </div>

            <div id="person-list" class="flex-1 overflow-y-auto divide-y divide-slate-100"></div>
        </aside>

        <!-- Canvas Area -->
        <main class="flex-1 relative overflow-hidden canvas-bg" id="canvas-wrapper">
            <svg id="tree-svg" class="w-full h-full absolute inset-0 cursor-grab active:cursor-grabbing">
                <g id="viewport">
                    <g id="poster-bg"></g>
                    <g id="lines-group"></g>
                    <g id="nodes-group"></g>
                </g>
            </svg>

            <!-- Navigation Controls -->
            <div class="absolute bottom-6 right-6 flex flex-col bg-white border border-slate-200 rounded-lg shadow-lg overflow-hidden">
                <button onclick="zoomIn()" class="p-2 hover:bg-slate-50 text-slate-600 hover:text-slate-900 transition-all" title="Přiblížit">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
                <button onclick="zoomOut()" class="p-2 hover:bg-slate-50 text-slate-600 hover:text-slate-900 transition-all border-t border-b border-slate-100" title="Oddálit">
                    <i data-lucide="minus" class="w-5 h-5"></i>
                </button>
                <button onclick="resetZoom()" class="p-2 hover:bg-slate-50 text-slate-600 hover:text-slate-900 transition-all" title="Vycentrovat">
                    <i data-lucide="maximize-2" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Empty State Prompt -->
            <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                <div class="bg-white/95 border border-slate-200 p-8 rounded-2xl shadow-xl max-w-md text-center pointer-events-auto backdrop-blur">
                    <div class="w-12 h-12 bg-slate-100 text-slate-700 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="folder-open" class="w-6 h-6"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-900 mb-1">Žádný rodokmen k zobrazení</h3>
                    <p class="text-xs text-slate-500 mb-6 leading-relaxed">Nahrajte váš GEDCOM (.ged) soubor nebo vytvořte první osobu pro sestavení přehledného rodokmenu.</p>
                    <div class="flex items-center justify-center space-x-3">
                        <label class="cursor-pointer bg-slate-900 hover:bg-slate-800 text-white font-medium px-4 py-2 rounded-lg text-xs flex items-center space-x-2 transition-all">
                            <i data-lucide="upload" class="w-4 h-4"></i>
                            <span>Načíst GEDCOM</span>
                            <input type="file" accept=".ged" onchange="handleFileUpload(event)" class="hidden">
                        </label>
                        <button onclick="createNewPerson()" class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium px-4 py-2 rounded-lg text-xs flex items-center space-x-2 transition-all">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            <span>Nová osoba</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-lg overflow-hidden text-slate-800">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <h3 class="font-bold text-slate-900 text-base">Detail osoby</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-200/50 transition-all">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                <input type="hidden" id="edit-id">

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Jméno</label>
                        <input type="text" id="edit-givenName" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:border-slate-400 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Příjmení</label>
                        <input type="text" id="edit-surname" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:border-slate-400 transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Pohlaví</label>
                        <select id="edit-sex" onchange="updateGenderFields()" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:border-slate-400 transition-all bg-white">
                            <option value="M">Muž</option>
                            <option value="F">Žena</option>
                        </select>
                    </div>
                    <div id="maiden-name-container">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Rodné příjmení</label>
                        <input type="text" id="edit-maidenName" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm text-slate-900 focus:outline-none focus:border-slate-400 transition-all">
                    </div>
                </div>

                <!-- Czech Date Pickers -->
                <div class="space-y-3 pt-2 border-t border-slate-100">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Datum narození</label>
                        <div class="grid grid-cols-3 gap-2">
                            <select id="edit-birthDay" class="border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-800 bg-white focus:outline-none focus:border-slate-400"></select>
                            <select id="edit-birthMonth" class="border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-800 bg-white focus:outline-none focus:border-slate-400"></select>
                            <input type="number" id="edit-birthYear" placeholder="Rok" class="border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-slate-400">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Datum úmrtí</label>
                        <div class="grid grid-cols-3 gap-2">
                            <select id="edit-deathDay" class="border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-800 bg-white focus:outline-none focus:border-slate-400"></select>
                            <select id="edit-deathMonth" class="border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-800 bg-white focus:outline-none focus:border-slate-400"></select>
                            <input type="number" id="edit-deathYear" placeholder="Rok" class="border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-slate-400">
                        </div>
                    </div>
                </div>

                <!-- Family Relatives Actions -->
                <div class="pt-4 border-t border-slate-100">
                    <label class="block text-xs font-semibold text-slate-600 mb-2">Vazby a rodina</label>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="addRelative('father')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg flex items-center space-x-1 transition-all">
                            <i data-lucide="plus" class="w-3 h-3"></i>
                            <span>Přidat otce</span>
                        </button>
                        <button onclick="addRelative('mother')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg flex items-center space-x-1 transition-all">
                            <i data-lucide="plus" class="w-3 h-3"></i>
                            <span>Přidat matku</span>
                        </button>
                        <button id="btn-add-spouse" onclick="addSpouse()" class="px-3 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 text-xs font-medium rounded-lg flex items-center space-x-1 transition-all">
                            <i data-lucide="heart" class="w-3 h-3 text-amber-600"></i>
                            <span id="label-add-spouse">Přidat manželku</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
                <button onclick="deleteCurrentPerson()" class="px-3 py-1.5 text-red-600 hover:bg-red-50 text-xs font-medium rounded-lg transition-all flex items-center space-x-1">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    <span>Smazat osobu</span>
                </button>
                <div class="flex items-center space-x-2">
                    <button onclick="closeModal()" class="px-4 py-2 border border-slate-300 text-slate-700 hover:bg-slate-100 text-xs font-medium rounded-lg transition-all">
                        Zrušit
                    </button>
                    <button onclick="savePersonModal()" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs rounded-lg transition-all">
                        Uložit změny
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Script Engine -->
    <script>
        let persons = {};
        let families = {};
        let activePersonId = null;
        let currentAppMode = 'tree'; // 'tree' or 'poster'

        // Pan Zoom State
        let scale = 0.85;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX = 0, startY = 0;

        // Card Dimensions
        const CARD_W = 190;
        const CARD_H = 72;
        const GAP_X = 70;
        const BASE_GAP_Y = 16;

        const CZECH_MONTHS = ["", "Leden", "Únor", "Březen", "Duben", "Květen", "Červen", "Červenec", "Srpen", "Září", "Říjen", "Listopad", "Prosinec"];
        const GEDCOM_MONTHS = {
            "JAN": 1, "FEB": 2, "MAR": 3, "APR": 4, "MAY": 5, "JUN": 6,
            "JUL": 7, "AUG": 8, "SEP": 9, "OCT": 10, "NOV": 11, "DEC": 12
        };

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            populateDateDropdowns();
            setupPanZoom();
            updateEmptyState();
        });

        function populateDateDropdowns() {
            ['edit-birthDay', 'edit-deathDay'].forEach(id => {
                const el = document.getElementById(id);
                el.innerHTML = '<option value="">Den</option>';
                for (let i = 1; i <= 31; i++) el.innerHTML += `<option value="${i}">${i}.</option>`;
            });

            ['edit-birthMonth', 'edit-deathMonth'].forEach(id => {
                const el = document.getElementById(id);
                el.innerHTML = '<option value="">Měsíc</option>';
                CZECH_MONTHS.forEach((m, idx) => {
                    if (idx > 0) el.innerHTML += `<option value="${idx}">${m}</option>`;
                });
            });
        }

        function parseGedcomDate(str) {
            if (!str) return { day: '', month: '', year: '' };
            const parts = str.trim().split(/\s+/);
            let day = '', month = '', year = '';

            parts.forEach(p => {
                const num = parseInt(p);
                const upper = p.toUpperCase();
                if (GEDCOM_MONTHS[upper]) month = GEDCOM_MONTHS[upper];
                else if (!isNaN(num) && num > 19) year = num;
                else if (!isNaN(num) && num <= 31) day = num;
            });

            return { day, month, year };
        }

        function buildGedcomDate(day, month, year) {
            const gedMonths = ["", "JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            const parts = [];
            if (day) parts.push(day);
            if (month && gedMonths[month]) parts.push(gedMonths[month]);
            if (year) parts.push(year);
            return parts.join(' ');
        }

        function formatDisplayDate(dateStr) {
            if (!dateStr) return '';
            const d = parseGedcomDate(dateStr);
            const parts = [];
            if (d.day) parts.push(`${d.day}.`);
            if (d.month && CZECH_MONTHS[d.month]) parts.push(CZECH_MONTHS[d.month]);
            if (d.year) parts.push(d.year);
            return parts.join(' ');
        }

        // GEDCOM Parser
        function parseGedcom(text) {
            const lines = text.split(/\r?\n/);
            const newPersons = {};
            const newFamilies = {};
            let currentRecord = null;
            let currentType = null;

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                const match = line.match(/^(\d+)\s+(@[^@]+@|[^\s]+)\s*(.*)$/);
                if (!match) continue;

                const level = parseInt(match[1]);
                const tagOrId = match[2];
                const value = match[3];

                if (level === 0) {
                    if (value === 'INDI') {
                        currentType = 'INDI';
                        currentRecord = { id: tagOrId, givenName: '', surname: '', maidenName: '', sex: 'M', birthDate: '', deathDate: '', famc: null, fams: [] };
                        newPersons[tagOrId] = currentRecord;
                    } else if (value === 'FAM') {
                        currentType = 'FAM';
                        currentRecord = { id: tagOrId, husband: null, wife: null, children: [] };
                        newFamilies[tagOrId] = currentRecord;
                    } else {
                        currentType = null; currentRecord = null;
                    }
                } else if (currentRecord && level === 1) {
                    if (currentType === 'INDI') {
                        if (tagOrId === 'NAME') {
                            const nameMatch = value.match(/(.*?)\/(.*?)\//);
                            if (nameMatch) {
                                currentRecord.givenName = nameMatch[1].trim();
                                currentRecord.surname = nameMatch[2].trim();
                            } else {
                                currentRecord.givenName = value.trim();
                            }
                        } else if (tagOrId === 'SEX') currentRecord.sex = value.trim().toUpperCase();
                        else if (tagOrId === 'FAMC') currentRecord.famc = value.trim();
                        else if (tagOrId === 'FAMS') currentRecord.fams.push(value.trim());
                        else if (tagOrId === '_MAIDEN' || tagOrId === '_MARNM') currentRecord.maidenName = value.trim();
                    } else if (currentType === 'FAM') {
                        if (tagOrId === 'HUSB') currentRecord.husband = value.trim();
                        if (tagOrId === 'WIFE') currentRecord.wife = value.trim();
                        if (tagOrId === 'CHIL') currentRecord.children.push(value.trim());
                    }
                }
            }

            let lastTag = '';
            for (let line of lines) {
                line = line.trim();
                const match = line.match(/^(\d+)\s+([^\s]+)\s*(.*)$/);
                if (!match) continue;
                const level = parseInt(match[1]);
                const tag = match[2];
                const val = match[3];

                if (level === 0) currentRecord = newPersons[tag] || newFamilies[tag] || null;
                else if (level === 1) lastTag = tag;
                else if (level === 2 && tag === 'DATE' && currentRecord && currentRecord.givenName !== undefined) {
                    if (lastTag === 'BIRT') currentRecord.birthDate = val;
                    if (lastTag === 'DEAT') currentRecord.deathDate = val;
                }
            }

            Object.values(newPersons).forEach(p => {
                if (p.sex === 'F' && !p.maidenName && p.surname) p.maidenName = p.surname;
            });

            return { persons: newPersons, families: newFamilies };
        }

        function exportGedcom() {
            let ged = "0 HEAD\n1 SOUR RodokmenStudio\n1 GEDC\n2 VERS 5.5.1\n1 CHAR UTF-8\n";
            Object.values(persons).forEach(p => {
                ged += `0 ${p.id} INDI\n1 NAME ${p.givenName} /${p.surname}/\n`;
                if (p.sex) ged += `1 SEX ${p.sex}\n`;
                if (p.maidenName) ged += `1 _MAIDEN ${p.maidenName}\n`;
                if (p.birthDate) ged += `1 BIRT\n2 DATE ${p.birthDate}\n`;
                if (p.deathDate) ged += `1 DEAT\n2 DATE ${p.deathDate}\n`;
                if (p.famc) ged += `1 FAMC ${p.famc}\n`;
                (p.fams || []).forEach(f => { ged += `1 FAMS ${f}\n`; });
            });
            Object.values(families).forEach(f => {
                ged += `0 ${f.id} FAM\n`;
                if (f.husband) ged += `1 HUSB ${f.husband}\n`;
                if (f.wife) ged += `1 WIFE ${f.wife}\n`;
                (f.children || []).forEach(c => { ged += `1 CHIL ${c}\n`; });
            });
            ged += "0 TRLR\n";

            const blob = new Blob([ged], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'rodokmen.ged';
            link.click();
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const parsed = parseGedcom(e.target.result);
                persons = parsed.persons;
                families = parsed.families;
                const keys = Object.keys(persons);
                activePersonId = keys.length > 0 ? keys[0] : null;
                updateEmptyState();
                renderPersonList();
                renderTree();
                resetZoom();
            };
            reader.readAsText(file);
        }

        function renderPersonList() {
            const container = document.getElementById('person-list');
            const search = document.getElementById('search-input').value.toLowerCase();
            document.getElementById('person-count').innerText = Object.keys(persons).length;
            container.innerHTML = '';

            const sorted = Object.values(persons).sort((a,b) => {
                const nameA = `${a.surname} ${a.givenName}`.toLowerCase();
                const nameB = `${b.surname} ${b.givenName}`.toLowerCase();
                return nameA.localeCompare(nameB);
            });

            sorted.forEach(p => {
                const fullName = `${p.givenName} ${p.surname}`.toLowerCase();
                if (search && !fullName.includes(search)) return;

                const isActive = p.id === activePersonId;
                const div = document.createElement('div');
                div.className = `p-3 flex items-center justify-between cursor-pointer transition-all ${
                    isActive ? 'bg-slate-100 border-l-4 border-slate-900' : 'hover:bg-slate-50'
                }`;
                
                const dates = [formatDisplayDate(p.birthDate), formatDisplayDate(p.deathDate)].filter(Boolean).join(' - ') || 'Bez datumu';
                const maiden = (p.sex === 'F' && p.maidenName) ? ` (${p.maidenName})` : '';

                div.innerHTML = `
                    <div class="overflow-hidden pr-2 flex-1" onclick="setActivePerson('${p.id}')">
                        <div class="font-medium text-slate-800 text-xs truncate">
                            ${p.givenName || 'Neznámé'} <span class="font-bold text-slate-900">${p.surname || ''}</span>
                            <span class="text-xs text-slate-400 font-normal">${maiden}</span>
                        </div>
                        <div class="text-[10px] text-slate-400 truncate">${dates}</div>
                    </div>
                    <button onclick="openEditModal('${p.id}'); event.stopPropagation();" class="p-1 hover:bg-slate-200 rounded text-slate-400 hover:text-slate-700">
                        <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                    </button>
                `;
                container.appendChild(div);
            });
            lucide.createIcons();
        }

        function setActivePerson(id) {
            activePersonId = id;
            renderPersonList();
            renderTree();
        }

        function setAppMode(mode) {
            currentAppMode = mode;
            const btnT = document.getElementById('btn-mode-tree');
            const btnP = document.getElementById('btn-mode-poster');
            if (mode === 'tree') {
                btnT.className = "px-3 py-1.5 rounded-md font-semibold transition-all bg-white shadow-sm text-slate-900";
                btnP.className = "px-3 py-1.5 rounded-md font-medium text-slate-600 hover:text-slate-900 transition-all";
            } else {
                btnP.className = "px-3 py-1.5 rounded-md font-semibold transition-all bg-white shadow-sm text-slate-900";
                btnT.className = "px-3 py-1.5 rounded-md font-medium text-slate-600 hover:text-slate-900 transition-all";
            }
            renderTree();
            resetZoom();
        }

        // --- PRECISE ANHENTAFEL TREE LAYOUT (NO SKIPPING/MIXING) ---
        function renderTree() {
            const posterBg = document.getElementById('poster-bg');
            const linesGroup = document.getElementById('lines-group');
            const nodesGroup = document.getElementById('nodes-group');

            posterBg.innerHTML = '';
            linesGroup.innerHTML = '';
            nodesGroup.innerHTML = '';

            if (!activePersonId || !persons[activePersonId]) return;

            if (currentAppMode === 'poster') {
                renderPosterBackground(posterBg);
            }

            const root = persons[activePersonId];
            const nodes = [];
            const connections = [];
            const marriages = [];

            // Root Node
            nodes.push({ id: root.id, person: root, x: 0, y: 0, isRoot: true });

            if (root.famc && families[root.famc]) {
                const fam = families[root.famc];
                
                if (fam.husband) {
                    const fatherSub = buildAhnentafelSubtree(fam.husband);
                    renderBranch(fatherSub, -CARD_W - GAP_X, 0, 'left', nodes, connections, marriages);
                    connections.push({ x1: -GAP_X, y1: 0, x2: 0, y2: 0 });
                }

                if (fam.wife) {
                    const motherSub = buildAhnentafelSubtree(fam.wife);
                    renderBranch(motherSub, CARD_W + GAP_X, 0, 'right', nodes, connections, marriages);
                    connections.push({ x1: CARD_W, y1: 0, x2: CARD_W + GAP_X, y2: 0 });
                }
            }

            drawGraphics(nodes, connections, marriages, linesGroup, nodesGroup);
        }

        function buildAhnentafelSubtree(personId) {
            if (!personId || !persons[personId]) return null;
            const p = persons[personId];

            let fatherSub = null;
            let motherSub = null;

            if (p.famc && families[p.famc]) {
                const fam = families[p.famc];
                if (fam.husband) fatherSub = buildAhnentafelSubtree(fam.husband);
                if (fam.wife) motherSub = buildAhnentafelSubtree(fam.wife);
            }

            const fH = fatherSub ? fatherSub.height : (CARD_H + BASE_GAP_Y);
            const mH = motherSub ? motherSub.height : (CARD_H + BASE_GAP_Y);
            const totalHeight = Math.max(CARD_H * 2 + BASE_GAP_Y, fH + mH + BASE_GAP_Y);

            return {
                id: p.id,
                person: p,
                fatherSub,
                motherSub,
                height: totalHeight
            };
        }

        function renderBranch(treeNode, x, yCenter, direction, nodes, connections, marriages) {
            if (!treeNode) return;

            const isLeft = direction === 'left';
            const fH = treeNode.fatherSub ? treeNode.fatherSub.height : (CARD_H + BASE_GAP_Y);
            const mH = treeNode.motherSub ? treeNode.motherSub.height : (CARD_H + BASE_GAP_Y);

            const husbandY = yCenter - (mH / 2) - (BASE_GAP_Y / 2);
            const wifeY = yCenter + (fH / 2) + (BASE_GAP_Y / 2);

            let fatherId = treeNode.fatherSub ? treeNode.fatherSub.id : null;
            let motherId = treeNode.motherSub ? treeNode.motherSub.id : null;

            if (fatherId && persons[fatherId]) {
                nodes.push({ id: fatherId, person: persons[fatherId], x, y: husbandY });
            }
            if (motherId && persons[motherId]) {
                nodes.push({ id: motherId, person: persons[motherId], x, y: wifeY });
            }

            if (fatherId && motherId) {
                const midX = x + (CARD_W / 2);
                marriages.push({ x: midX, y1: husbandY + CARD_H, y2: wifeY });

                const connX = isLeft ? x - (GAP_X / 2) : x + CARD_W + (GAP_X / 2);
                connections.push({
                    x1: isLeft ? x : x + CARD_W,
                    y1: yCenter,
                    x2: connX,
                    y2: yCenter
                });
            }

            const nextX = isLeft ? x - CARD_W - GAP_X : x + CARD_W + GAP_X;

            if (treeNode.fatherSub) {
                renderBranch(treeNode.fatherSub, nextX, husbandY, direction, nodes, connections, marriages);
            }
            if (treeNode.motherSub) {
                renderBranch(treeNode.motherSub, nextX, wifeY, direction, nodes, connections, marriages);
            }
        }

        function drawGraphics(nodes, connections, marriages, linesGroup, nodesGroup) {
            marriages.forEach(m => {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", m.x);
                line.setAttribute("y1", m.y1);
                line.setAttribute("x2", m.x);
                line.setAttribute("y2", m.y2);
                line.setAttribute("stroke", "#d97706");
                line.setAttribute("stroke-width", "2");
                line.setAttribute("stroke-dasharray", "4 3");
                linesGroup.appendChild(line);

                const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                dot.setAttribute("cx", m.x);
                dot.setAttribute("cy", (m.y1 + m.y2) / 2);
                dot.setAttribute("r", "4.5");
                dot.setAttribute("fill", "#0284c7");
                linesGroup.appendChild(dot);
            });

            connections.forEach(c => {
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                const midX = (c.x1 + c.x2) / 2;
                const d = `M ${c.x1} ${c.y1} C ${midX} ${c.y1}, ${midX} ${c.y2}, ${c.x2} ${c.y2}`;
                path.setAttribute("d", d);
                path.setAttribute("fill", "none");
                path.setAttribute("stroke", "#eab308");
                path.setAttribute("stroke-width", "2");
                linesGroup.appendChild(path);
            });

            nodes.forEach(n => {
                const p = n.person;
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("transform", `translate(${n.x}, ${n.y})`);
                g.setAttribute("class", "cursor-pointer");
                g.onclick = () => openEditModal(n.id);

                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("width", CARD_W);
                rect.setAttribute("height", CARD_H);
                rect.setAttribute("rx", "12");
                rect.setAttribute("fill", "#ffffff");
                rect.setAttribute("stroke", n.isRoot ? "#d97706" : "#fbbf24");
                rect.setAttribute("stroke-width", n.isRoot ? "2.5" : "1.5");
                rect.setAttribute("class", "shadow-sm hover:shadow-md transition-all");
                g.appendChild(rect);

                const badge = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                badge.setAttribute("cx", "20");
                badge.setAttribute("cy", "22");
                badge.setAttribute("r", "9");
                badge.setAttribute("fill", p.sex === 'F' ? "#fce7f3" : "#e0f2fe");
                g.appendChild(badge);

                const badgeText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                badgeText.setAttribute("x", "20");
                badgeText.setAttribute("y", "25");
                badgeText.setAttribute("text-anchor", "middle");
                badgeText.setAttribute("font-size", "10");
                badgeText.setAttribute("font-weight", "bold");
                badgeText.setAttribute("fill", p.sex === 'F' ? "#ec4899" : "#0284c7");
                badgeText.textContent = p.sex === 'F' ? '♀' : '♂';
                g.appendChild(badgeText);

                const nameText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                nameText.setAttribute("x", "36");
                nameText.setAttribute("y", "23");
                nameText.setAttribute("font-size", "12");
                nameText.setAttribute("font-weight", "700");
                nameText.setAttribute("fill", "#0f172a");
                
                let fullName = `${p.givenName || ''} ${p.surname || ''}`;
                if (fullName.length > 18) fullName = fullName.substring(0, 16) + '…';
                nameText.textContent = fullName;
                g.appendChild(nameText);

                let currentY = 39;
                if (p.sex === 'F' && p.maidenName) {
                    const mText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    mText.setAttribute("x", "36");
                    mText.setAttribute("y", currentY);
                    mText.setAttribute("font-size", "10");
                    mText.setAttribute("fill", "#64748b");
                    mText.textContent = `r. ${p.maidenName}`;
                    g.appendChild(mText);
                    currentY += 15;
                }

                const dates = [p.birthDate ? `* ${formatDisplayDate(p.birthDate)}` : '', p.deathDate ? `+ ${formatDisplayDate(p.deathDate)}` : ''].filter(Boolean).join(' ');
                if (dates) {
                    const dateText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    dateText.setAttribute("x", "36");
                    dateText.setAttribute("y", currentY);
                    dateText.setAttribute("font-size", "9");
                    dateText.setAttribute("fill", "#94a3b8");
                    dateText.textContent = dates.length > 22 ? dates.substring(0, 20) + '…' : dates;
                    g.appendChild(dateText);
                }

                nodesGroup.appendChild(g);
            });
        }

        function renderPosterBackground(posterBg) {
            const root = persons[activePersonId];
            const surname = (root.surname || 'RODINA').toUpperCase();

            posterBg.innerHTML = `
                <rect x="-1500" y="-1500" width="4000" height="3000" fill="#090d16" />
                <rect x="-800" y="-700" width="1600" height="1200" fill="none" stroke="#d97706" stroke-width="3" opacity="0.4" />
                <rect x="-785" y="-685" width="1570" height="1170" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6" />
                
                <g transform="translate(0, -580)">
                    <circle cx="0" cy="0" r="26" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.8" />
                    <path d="M0 -32 L5 -8 L28 0 L5 8 L0 32 L-5 8 L-28 0 L-5 -8 Z" fill="#f59e0b" opacity="0.85" />
                </g>

                <text x="0" y="-510" text-anchor="middle" font-family="Cinzel, serif" font-size="32" font-weight="700" fill="#fef3c7" letter-spacing="4">RODOVÝ STROM RODINY ${surname}</text>
                <text x="0" y="-480" text-anchor="middle" font-family="Cinzel, serif" font-size="13" font-weight="500" fill="#f59e0b" letter-spacing="2" opacity="0.8">PŘÍMÁ LINIE PŘEDKŮ | TISKOVÁ EDICE</text>
            `;
        }

        // Navigation Pan Zoom
        function setupPanZoom() {
            const svg = document.getElementById('tree-svg');
            svg.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'svg' || e.target.id === 'poster-bg' || e.target.id === 'lines-group') {
                    isDragging = true;
                    startX = e.clientX - panX;
                    startY = e.clientY - panY;
                }
            });
            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    panX = e.clientX - startX;
                    panY = e.clientY - startY;
                    updateViewportTransform();
                }
            });
            window.addEventListener('mouseup', () => { isDragging = false; });
            svg.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
                scale = Math.min(Math.max(0.15, scale * zoomFactor), 3);
                updateViewportTransform();
            });
        }

        function updateViewportTransform() {
            document.getElementById('viewport').setAttribute('transform', `translate(${panX}, ${panY}) scale(${scale})`);
        }

        function zoomIn() { scale = Math.min(3, scale * 1.2); updateViewportTransform(); }
        function zoomOut() { scale = Math.max(0.15, scale / 1.2); updateViewportTransform(); }
        function resetZoom() {
            const wrapper = document.getElementById('canvas-wrapper');
            panX = wrapper.clientWidth / 2;
            panY = wrapper.clientHeight / 2;
            scale = 0.85;
            updateViewportTransform();
        }

        // Modal Controls
        function openEditModal(id) {
            const p = persons[id];
            if (!p) return;

            document.getElementById('edit-id').value = p.id;
            document.getElementById('edit-givenName').value = p.givenName || '';
            document.getElementById('edit-surname').value = p.surname || '';
            document.getElementById('edit-sex').value = p.sex || 'M';
            document.getElementById('edit-maidenName').value = p.maidenName || '';

            const bDate = parseGedcomDate(p.birthDate);
            document.getElementById('edit-birthDay').value = bDate.day || '';
            document.getElementById('edit-birthMonth').value = bDate.month || '';
            document.getElementById('edit-birthYear').value = bDate.year || '';

            const dDate = parseGedcomDate(p.deathDate);
            document.getElementById('edit-deathDay').value = dDate.day || '';
            document.getElementById('edit-deathMonth').value = dDate.month || '';
            document.getElementById('edit-deathYear').value = dDate.year || '';

            updateGenderFields();
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function updateGenderFields() {
            const sex = document.getElementById('edit-sex').value;
            const container = document.getElementById('maiden-name-container');
            const spouseLabel = document.getElementById('label-add-spouse');

            if (sex === 'F') {
                container.classList.remove('opacity-40', 'pointer-events-none');
                spouseLabel.innerText = "Přidat manžela";
            } else {
                container.classList.add('opacity-40', 'pointer-events-none');
                spouseLabel.innerText = "Přidat manželku";
            }
        }

        function closeModal() { document.getElementById('edit-modal').classList.add('hidden'); }

        function savePersonModal() {
            const id = document.getElementById('edit-id').value;
            if (!persons[id]) return;

            persons[id].givenName = document.getElementById('edit-givenName').value;
            persons[id].surname = document.getElementById('edit-surname').value;
            persons[id].sex = document.getElementById('edit-sex').value;
            persons[id].maidenName = document.getElementById('edit-maidenName').value;

            const bDay = document.getElementById('edit-birthDay').value;
            const bMonth = document.getElementById('edit-birthMonth').value;
            const bYear = document.getElementById('edit-birthYear').value;
            persons[id].birthDate = buildGedcomDate(bDay, bMonth, bYear);

            const dDay = document.getElementById('edit-deathDay').value;
            const dMonth = document.getElementById('edit-deathMonth').value;
            const dYear = document.getElementById('edit-deathYear').value;
            persons[id].deathDate = buildGedcomDate(dDay, dMonth, dYear);

            closeModal();
            renderPersonList();
            renderTree();
        }

        function createNewPerson() {
            const newId = `@I${Date.now()}@`;
            persons[newId] = { id: newId, givenName: 'Nová', surname: 'Osoba', sex: 'M', maidenName: '', birthDate: '', deathDate: '', famc: null, fams: [] };
            activePersonId = newId;
            updateEmptyState();
            renderPersonList();
            openEditModal(newId);
        }

        function deleteCurrentPerson() {
            const id = document.getElementById('edit-id').value;
            if (confirm('Opravdu chcete tuto osobu smazat?')) {
                delete persons[id];
                closeModal();
                const keys = Object.keys(persons);
                activePersonId = keys.length > 0 ? keys[0] : null;
                updateEmptyState();
                renderPersonList();
                renderTree();
            }
        }

        function addRelative(type) {
            const currentId = document.getElementById('edit-id').value;
            const newId = `@I${Date.now()}@`;
            persons[newId] = {
                id: newId,
                givenName: type === 'father' ? 'Otec' : 'Matka',
                surname: persons[currentId].surname || '',
                sex: type === 'mother' ? 'F' : 'M',
                maidenName: '', birthDate: '', deathDate: '', famc: null, fams: []
            };

            let famId = persons[currentId].famc;
            if (!famId) {
                famId = `@F${Date.now()}@`;
                families[famId] = { id: famId, husband: null, wife: null, children: [currentId] };
                persons[currentId].famc = famId;
            }

            if (type === 'father') families[famId].husband = newId;
            if (type === 'mother') families[famId].wife = newId;

            closeModal();
            renderPersonList();
            renderTree();
            openEditModal(newId);
        }

        function addSpouse() {
            const currentId = document.getElementById('edit-id').value;
            const current = persons[currentId];
            const newId = `@I${Date.now()}@`;
            const spouseSex = current.sex === 'F' ? 'M' : 'F';

            persons[newId] = {
                id: newId,
                givenName: spouseSex === 'M' ? 'Manžel' : 'Manželka',
                surname: current.surname || '',
                sex: spouseSex,
                maidenName: '', birthDate: '', deathDate: '', famc: null, fams: []
            };

            const famId = `@F${Date.now()}@`;
            families[famId] = {
                id: famId,
                husband: spouseSex === 'M' ? newId : currentId,
                wife: spouseSex === 'F' ? newId : currentId,
                children: []
            };

            current.fams.push(famId);
            persons[newId].fams.push(famId);

            closeModal();
            renderPersonList();
            renderTree();
            openEditModal(newId);
        }

        function updateEmptyState() {
            document.getElementById('empty-state').style.display = Object.keys(persons).length === 0 ? 'flex' : 'none';
        }

        function exportSVG() {
            const svg = document.getElementById('tree-svg');
            const serializer = new XMLSerializer();
            let source = serializer.serializeToString(svg);
            if (!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
                source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
            }
            const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(source);
            const downloadLink = document.createElement("a");
            downloadLink.href = url;
            downloadLink.download = "rodokmen_final.svg";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
