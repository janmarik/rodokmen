František Cukr<!DOCTYPE html>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-script { font-family: 'Pinyon Script', cursive; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Canvas Pattern Grid */
        .bg-grid {
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        /* SVG Royal Frame Styles */
        .royal-border {
            border: 12px double #d4af37;
            box-shadow: inset 0 0 30px rgba(212, 175, 55, 0.15), 0 0 20px rgba(0,0,0,0.8);
        }

        /* Print styling */
        @media print {
            body * { visibility: hidden; }
            #poster-export-area, #poster-export-area * { visibility: visible; }
            #poster-export-area { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
        }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden select-none">

    <!-- JAVASCRIPT LOGIKA APLIKACE -->
    <script>
        // --- STAV APLIKACE ---
        let currentView = 'poster'; // 'poster' | 'tree'
        let people = {}; // ID -> Person Object
        let families = {}; // ID -> Family Object
        let rootPersonId = null;

        // Pan & Zoom
        let zoomLevel = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX = 0, startY = 0;

        // Měsíce Česky <-> GEDCOM Anglicky
        const MONTHS_CZ = ["", "Leden", "Únor", "Březen", "Duben", "Květen", "Červen", "Červenec", "Srpen", "Září", "Říjen", "Listopad", "Prosinec"];
        const MONTHS_GEDCOM = ["", "JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

        // --- INICIALIZACE APLIKACE ---
        window.onload = function() {
            lucide.createIcons();
            populateDayDropdowns();
            setupPanZoom();
            loadSampleData();
        };

        // Naplnění výběru dnů 1-31
        function populateDayDropdowns() {
            ['edit-birth-day', 'edit-death-day'].forEach(id => {
                const sel = document.getElementById(id);
                for(let i=1; i<=31; i++) {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = i;
                    sel.appendChild(opt);
                }
            });
        }

        // --- PAN & ZOOM LOGIKA ---
        function setupPanZoom() {
            const container = document.getElementById('canvas-container');
            const viewport = document.getElementById('viewport');

            container.addEventListener('mousedown', (e) => {
                if (e.target.closest('#person-modal') || e.target.closest('button')) return;
                isDragging = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                applyTransform();
            });

            window.addEventListener('mouseup', () => isDragging = false);

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = 1.1;
                if (e.deltaY < 0) {
                    zoomLevel = Math.min(zoomLevel * zoomFactor, 3);
                } else {
                    zoomLevel = Math.max(zoomLevel / zoomFactor, 0.3);
                }
                applyTransform();
            });
        }

        function applyTransform() {
            const viewport = document.getElementById('viewport');
            viewport.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
            document.getElementById('zoom-indicator').textContent = `${Math.round(zoomLevel * 100)}%`;
        }

        function zoomIn() { zoomLevel = Math.min(zoomLevel * 1.2, 3); applyTransform(); }
        function zoomOut() { zoomLevel = Math.max(zoomLevel / 1.2, 0.3); applyTransform(); }
        function zoomReset() { zoomLevel = 1; applyTransform(); }
        function centerView() { panX = 0; panY = 0; zoomLevel = 1; applyTransform(); }

        // --- POHLED 1: PLAKÁT PŘÍMÉ LINIE (ROYAL GOLD) ---
        function renderPosterTree() {
            const container = document.getElementById('poster-tree-content');
            container.innerHTML = '';

            if (!rootPersonId || !people[rootPersonId]) {
                container.innerHTML = '<div class="text-slate-500 italic py-10">Vyberte osobu ze seznamu pro vygenerování plakátu.</div>';
                return;
            }

            // Konstrukce stromu předků (4 generace pro optimální plakátový vzhled)
            const ancestors = getAncestorsTree(rootPersonId, 3);

            const treeEl = document.createElement('div');
            treeEl.className = "flex flex-col items-center gap-12 w-full";

            // Generace 3: Prarodiče prarodičů (Top)
            const gen3 = renderPosterRow(ancestors.gen3, "Prarodiče");
            // Generace 2: Prarodiče
            const gen2 = renderPosterRow(ancestors.gen2, "Rodiče");
            // Generace 1: Kořenový potomek (Bottom)
            const gen1 = renderPosterRow([people[rootPersonId]], "Hlavní linie");

            treeEl.appendChild(gen3);
            treeEl.appendChild(gen2);
            treeEl.appendChild(gen1);

            container.appendChild(treeEl);
            lucide.createIcons();
        }

        function getAncestorsTree(personId, maxDepth) {
            const result = { gen1: [], gen2: [], gen3: [] };
            
            function trace(id, depth) {
                if (!id || !people[id]) return;
                const p = people[id];
                
                if (depth === 1) result.gen1.push(p);
                if (depth === 2) result.gen2.push(p);
                if (depth === 3) result.gen3.push(p);

                if (depth < maxDepth && p.famc && families[p.famc]) {
                    const fam = families[p.famc];
                    trace(fam.husb, depth + 1);
                    trace(fam.wife, depth + 1);
                }
            }

            trace(personId, 1);
            return result;
        }

        // --- POHLED 2: PRACOVNÍ STROM (LEŽATÉ PŘESÝPACÍ HODINY) ---
        function renderHourglassTree() {
            const container = document.getElementById('hourglass-tree-content');
            container.innerHTML = '';

            if (!rootPersonId || !people[rootPersonId]) return;

            const root = people[rootPersonId];

            // Hlavní mřížka: Otcovská linie (Vlevo) <--- Střední Osoba ---> Mateřská linie (Vpravo)
            const mainGrid = document.createElement('div');
            mainGrid.className = "flex items-center gap-16 justify-center w-full relative";

            // Levá strana (Otcovská linie)
            const fatherSide = document.createElement('div');
            fatherSide.className = "flex flex-col items-end gap-6";
            renderLineageBranch(getRootFather(root.id), fatherSide, 'left');

            // Středový blok (Vybraná osoba + Případný Partner nad/pod sebou)
            const centerBlock = document.createElement('div');
            centerBlock.className = "flex flex-col items-center gap-4 z-10";
            
            // Kartička hlavní osoby
            const rootCard = createTreePersonCard(root, true);
            centerBlock.appendChild(rootCard);

            // Zobrazení partnerů
            if (root.fams && root.fams.length > 0) {
                root.fams.forEach(famId => {
                    const fam = families[famId];
                    if (!fam) return;
                    const spouseId = fam.husb === root.id ? fam.wife : fam.husb;
                    if (spouseId && people[spouseId]) {
                        const spouseCard = createTreePersonCard(people[spouseId], false);
                        
                        // Vertikální svorka spojující manžele
                        const spouseWrapper = document.createElement('div');

                        centerBlock.appendChild(spouseWrapper);
                    }
                });
            }

            // Pravá strana (Mateřská linie)
            const motherSide = document.createElement('div');
            motherSide.className = "flex flex-col items-start gap-6";
            renderLineageBranch(getRootMother(root.id), motherSide, 'right');

            mainGrid.appendChild(fatherSide);
            mainGrid.appendChild(centerBlock);
            mainGrid.appendChild(motherSide);

            container.appendChild(mainGrid);
            lucide.createIcons();
        }

        // --- PŘIDÁVÁNÍ RODINNÝCH VAZEB (VČETNĚ NOVÉHO TLAČÍTKA MANŽEL/KA) ---
        function addRelation(type) {
            const currentId = document.getElementById('edit-id').value;
            if (!currentId || !people[currentId]) return;

            const currentP = people[currentId];
            savePersonModal(); // Uložíme nejdřív formulář

            const newId = 'I' + (Object.keys(people).length + 1);
            const newFamId = 'F' + (Object.keys(families).length + 1);

            if (type === 'father' || type === 'mother') {
                const isFather = type === 'father';
                const newPerson = {
                    id: newId,
                    givenName: isFather ? "Nový" : "Nová",
                    surname: currentP.surname || "Rodič",
                    sex: isFather ? "M" : "F",
                    birth: {}, death: {}, fams: [newFamId]
                };
                people[newId] = newPerson;

                if (!currentP.famc) {
                    families[newFamId] = { id: newFamId, husb: isFather ? newId : null, wife: isFather ? null : newId, chil: [currentId] };
                    currentP.famc = newFamId;
                } else {
                    const existingFam = families[currentP.famc];
                    if (isFather) existingFam.husb = newId;
                    else existingFam.wife = newId;
                }
            } 
            else if (type === 'spouse') {
                // NOVÉ TLAČÍTKO: Vytvořit manželku / manžela opačného pohlaví
                const isCurrentMale = currentP.sex === 'M';
                const newSpouseSex = isCurrentMale ? 'F' : 'M';

                const newSpouse = {
                    id: newId,
                    givenName: isCurrentMale ? "Nová" : "Nový",
                    surname: currentP.surname || "Manžel/ka",
                    sex: newSpouseSex,
                    birth: {}, death: {}, fams: [newFamId]
                };
                people[newId] = newSpouse;

                // Vytvoření rodiny a vazeb
                families[newFamId] = {
                    id: newFamId,
                    husb: isCurrentMale ? currentId : newId,
                    wife: isCurrentMale ? newId : currentId,
                    chil: []
                };

                if (!currentP.fams) currentP.fams = [];
                currentP.fams.push(newFamId);
            }
            else if (type === 'child') {
                const newChild = {
                    id: newId,
                    givenName: "Nové",
                    surname: currentP.surname || "Dítě",
                    sex: "M",
                    birth: {}, death: {}, famc: null
                };

                let targetFamId = currentP.fams && currentP.fams.length > 0 ? currentP.fams[0] : null;

                if (!targetFamId) {
                    families[newFamId] = {
                        id: newFamId,
                        husb: currentP.sex === 'M' ? currentId : null,
                        wife: currentP.sex === 'F' ? currentId : null,
                        chil: [newId]
                    };
                    if (!currentP.fams) currentP.fams = [];
                    currentP.fams.push(newFamId);
                    newChild.famc = newFamId;
                } else {
                    families[targetFamId].chil.push(newId);
                    newChild.famc = targetFamId;
                }
                people[newId] = newChild;
            }

            renderPeopleList();
            renderCurrentView();
            openModal(newId);
        }

        // --- HELPER PRO DATUMY ---
        function formatCzechDate(dateObj) {
            if (!dateObj) return '';
            const parts = [];
            if (dateObj.day) parts.push(dateObj.day + '.');
            if (dateObj.month && MONTHS_CZ[dateObj.month]) parts.push(MONTHS_CZ[dateObj.month]);
            if (dateObj.year) parts.push(dateObj.year);
            return parts.join(' ');
        }

        // --- IMPORT & EXPORT GEDCOM ---
        function handleImportGEDCOM(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                parseGEDCOM(e.target.result);
            };
            reader.readAsText(file);
        }

        function parseGEDCOM(text) {
            people = {};
            families = {};
            const lines = text.split(/\r?\n/);

            let currentObj = null;
            let currentType = null;
            let lastTag = '';

            lines.forEach(line => {
                line = line.trim();
                if (!line) return;

                const parts = line.split(' ');
                const level = parts[0];
                let tag = parts[1];
                let value = parts.slice(2).join(' ');

                if (parts[2] === 'INDI' || parts[2] === 'FAM') {
                    tag = parts[2];
                    value = parts[1];
                }

                if (level === '0') {
                    if (tag === 'INDI') {
                        const id = value.replace(/@/g, '');
                        currentObj = { id: id, givenName: '', surname: '', sex: 'M', birth: {}, death: {}, fams: [] };
                        people[id] = currentObj;
                        currentType = 'INDI';
                    } else if (tag === 'FAM') {
                        const id = value.replace(/@/g, '');
                        currentObj = { id: id, husb: null, wife: null, chil: [] };
                        families[id] = currentObj;
                        currentType = 'FAM';
                    } else {
                        currentType = null;
                    }
                } else if (currentType === 'INDI' && currentObj) {
                    if (tag === 'GIVN') currentObj.givenName = value;
                    else if (tag === 'SURN') currentObj.surname = value;
                    else if (tag === '_MARNM') currentObj.maidenName = value;
                    else if (tag === 'SEX') currentObj.sex = value;
                    else if (tag === 'FAMC') currentObj.famc = value.replace(/@/g, '');
                    else if (tag === 'FAMS') currentObj.fams.push(value.replace(/@/g, ''));
                    else if (tag === 'DATE') {
                        const parsedDate = parseGedcomDate(value);
                        if (lastTag === 'BIRT') currentObj.birth = parsedDate;
                        if (lastTag === 'DEAT') currentObj.death = parsedDate;
                    } else if (tag === 'PLAC') {
                        if (lastTag === 'BIRT') currentObj.birth.place = value;
                        if (lastTag === 'DEAT') currentObj.death.place = value;
                    }
                    if (tag === 'BIRT' || tag === 'DEAT') lastTag = tag;
                } else if (currentType === 'FAM' && currentObj) {
                    if (tag === 'HUSB') currentObj.husb = value.replace(/@/g, '');
                    else if (tag === 'WIFE') currentObj.wife = value.replace(/@/g, '');
                    else if (tag === 'CHIL') currentObj.chil.push(value.replace(/@/g, ''));
                }
            });

            const keys = Object.keys(people);
            if (keys.length > 0) rootPersonId = keys[0];
            
            renderPeopleList();
            renderCurrentView();
        }

        function parseGedcomDate(dateStr) {
            const parts = dateStr.trim().split(' ');
            let day = null, month = null, year = null;

            parts.forEach(p => {
                if (!isNaN(p) && p.length <= 2) day = parseInt(p);
                else if (MONTHS_GEDCOM.includes(p.toUpperCase())) month = MONTHS_GEDCOM.indexOf(p.toUpperCase());
                else if (!isNaN(p) && p.length === 4) year = parseInt(p);
            });

            return { day, month, year };
        }

        function exportGEDCOM() {
            let ged = "0 HEAD\n1 SOUR RODOKMEN_APP\n1 GEDC\n2 VERS 5.5.1\n2 FORM LINEAGE-LINKED\n1 CHAR UTF-8\n";

            Object.values(people).forEach(p => {
                ged += `0 @${p.id}@ INDI\n`;
                ged += `1 NAME ${p.givenName || ''} /${p.surname || ''}/\n`;
                if (p.givenName) ged += `2 GIVN ${p.givenName}\n`;
                if (p.surname) ged += `2 SURN ${p.surname}\n`;
                if (p.maidenName) ged += `1 _MARNM ${p.maidenName}\n`;
                if (p.sex) ged += `1 SEX ${p.sex}\n`;

                if (p.birth && (p.birth.year || p.birth.month || p.birth.day)) {
                    ged += `1 BIRT\n`;
                    let dStr = formatGedcomDateStr(p.birth);
                    if (dStr) ged += `2 DATE ${dStr}\n`;
                    if (p.birth.place) ged += `2 PLAC ${p.birth.place}\n`;
                }

                if (p.death && (p.death.year || p.death.month || p.death.day)) {
                    ged += `1 DEAT\n`;
                    let dStr = formatGedcomDateStr(p.death);
                    if (dStr) ged += `2 DATE ${dStr}\n`;
                    if (p.death.place) ged += `2 PLAC ${p.death.place}\n`;
                }

                if (p.famc) ged += `1 FAMC @${p.famc}@\n`;
                if (p.fams) p.fams.forEach(f => ged += `1 FAMS @${f}@\n`);
            });

            Object.values(families).forEach(f => {
                ged += `0 @${f.id}@ FAM\n`;
                if (f.husb) ged += `1 HUSB @${f.husb}@\n`;
                if (f.wife) ged += `1 WIFE @${f.wife}@\n`;
                if (f.chil) f.chil.forEach(c => ged += `1 CHIL @${c}@\n`);
            });

            ged += "0 TLR\n";

            const blob = new Blob([ged], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'rodokmen_export.ged';
            link.click();
        }

        function formatGedcomDateStr(dObj) {
            const parts = [];
            if (dObj.day) parts.push(dObj.day);
            if (dObj.month && MONTHS_GEDCOM[dObj.month]) parts.push(MONTHS_GEDCOM[dObj.month]);
            if (dObj.year) parts.push(dObj.year);
            return parts.join(' ');
        }

        // --- EXPORT SVG PRO TISK ---
        function exportSVG() {
            const area = document.getElementById('poster-export-area');
            const svgContent = `
                <svg xmlns="http://www.w3.org/2000/svg" width="${area.clientWidth}" height="${area.clientHeight}">
                    <foreignObject width="100%" height="100%">
                        <div xmlns="http://www.w3.org/1999/xhtml">
                            ${area.outerHTML}
                        </div>
                    </foreignObject>
                </svg>
            `;
            const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'rodokmen_plakat.svg';
            link.click();
        }
    </script>
