<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodokmen Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .canvas-container {
            background-image: radial-gradient(circle, #e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden select-none">

    <!-- Top Header -->
    <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between z-10 shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-slate-900 text-white rounded-lg">
                <i data-lucide="network" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-slate-900 text-lg leading-tight">Rodokmen Studio</h1>
                <p class="text-xs text-slate-500">Minimalistická správa rodokmenu</p>
            </div>
        </div>

        <!-- Mode Selectors -->
        <div class="flex items-center space-x-2 bg-slate-100 p-1 rounded-lg text-sm">
            <button id="btn-view-ancestors" onclick="setViewMode('ancestors')" class="px-3 py-1.5 rounded-md font-medium transition-all bg-white shadow-sm text-slate-900">
                Vývod (Předkové)
            </button>
            <button id="btn-view-descendants" onclick="setViewMode('descendants')" class="px-3 py-1.5 rounded-md font-medium text-slate-600 hover:text-slate-900 transition-all">
                Rozrod (Potomci)
            </button>
            <button id="btn-view-all" onclick="setViewMode('all')" class="px-3 py-1.5 rounded-md font-medium text-slate-600 hover:text-slate-900 transition-all">
                Celý rodokmen
            </button>
        </div>

        <!-- Template & Actions -->
        <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-2 bg-slate-100 px-3 py-1.5 rounded-lg text-sm">
                <i data-lucide="palette" class="w-4 h-4 text-slate-500"></i>
                <select id="template-select" onchange="changeTemplate(this.value)" class="bg-transparent font-medium text-slate-700 outline-none cursor-pointer">
                    <option value="nordic">Čistý Nordic (Monochrom)</option>
                    <option value="slate">Slate Accent (Břidlice)</option>
                    <option value="minimal">Ultra Minimal (Mřížka)</option>
                </select>
            </div>

            <label class="cursor-pointer bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium px-3 py-1.5 rounded-lg text-sm flex items-center space-x-2 transition-all shadow-sm">
                <i data-lucide="upload" class="w-4 h-4"></i>
                <span>Načíst GEDCOM</span>
                <input type="file" id="gedcom-input" accept=".ged" onchange="handleFileUpload(event)" class="hidden">
            </label>

            <button onclick="exportGedcom()" class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium px-3 py-1.5 rounded-lg text-sm flex items-center space-x-2 transition-all shadow-sm">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span>Uložit GEDCOM</span>
            </button>

            <button onclick="exportSVG()" class="bg-slate-900 hover:bg-slate-800 text-white font-medium px-3 py-1.5 rounded-lg text-sm flex items-center space-x-2 transition-all shadow-sm">
                <i data-lucide="image" class="w-4 h-4"></i>
                <span>Export SVG</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- Left Sidebar: Persons List -->
        <aside class="w-80 bg-white border-r border-slate-200 flex flex-col z-10 shadow-sm">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                <div class="font-semibold text-slate-800 flex items-center space-x-2">
                    <span>OSOBY V RODOKMENU</span>
                    <span id="person-count" class="bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </div>
                <button onclick="createNewPerson()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded flex items-center space-x-1 transition-all">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    <span>Nová</span>
                </button>
            </div>

            <div class="p-3 border-b border-slate-100">
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
                    <input type="text" id="search-input" oninput="renderPersonList()" placeholder="Hledat podle jména..." class="w-full pl-9 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-slate-400 transition-all">
                </div>
            </div>

            <div id="person-list" class="flex-1 overflow-y-auto divide-y divide-slate-100">
                <!-- Person items populated dynamically -->
            </div>
        </aside>

        <!-- Canvas / Tree Area -->
        <main class="flex-1 relative overflow-hidden canvas-container bg-slate-50/50" id="canvas-wrapper">
            
            <svg id="tree-svg" class="w-full h-full absolute inset-0 cursor-grab active:cursor-grabbing">
                <g id="viewport">
                    <g id="lines-group"></g>
                    <g id="nodes-group"></g>
                </g>
            </svg>

            <!-- Navigation / Pan-Zoom Controls -->
            <div class="absolute bottom-6 right-6 flex flex-col bg-white border border-slate-200 rounded-lg shadow-lg overflow-hidden">
                <button onclick="zoomIn()" class="p-2 hover:bg-slate-50 border-b border-slate-100 text-slate-600 hover:text-slate-900 transition-all" title="Přiblížit">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
                <button onclick="zoomOut()" class="p-2 hover:bg-slate-50 border-b border-slate-100 text-slate-600 hover:text-slate-900 transition-all" title="Oddálit">
                    <i data-lucide="minus" class="w-5 h-5"></i>
                </button>
                <button onclick="resetZoom()" class="p-2 hover:bg-slate-50 text-slate-600 hover:text-slate-900 transition-all" title="Vycentrovat">
                    <i data-lucide="maximize-2" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Empty State Prompt -->
            <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                <div class="bg-white/90 backdrop-blur border border-slate-200 p-8 rounded-2xl shadow-xl max-w-md text-center pointer-events-auto">
                    <div class="w-12 h-12 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="folder-open" class="w-6 h-6"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-900 mb-1">Žádný rodokmen k zobrazení</h3>
                    <p class="text-sm text-slate-500 mb-6">Nahrajte soubor GEDCOM (.ged) nebo vytvořte první osobu pro zahájení stavby rodokmenu.</p>
                    <div class="flex items-center justify-center space-x-3">
                        <label class="cursor-pointer bg-slate-900 hover:bg-slate-800 text-white font-medium px-4 py-2 rounded-lg text-sm flex items-center space-x-2 transition-all">
                            <i data-lucide="upload" class="w-4 h-4"></i>
                            <span>Načíst GEDCOM</span>
                            <input type="file" accept=".ged" onchange="handleFileUpload(event)" class="hidden">
                        </label>
                        <button onclick="createNewPerson()" class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium px-4 py-2 rounded-lg text-sm flex items-center space-x-2 transition-all">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            <span>Nová osoba</span>
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-lg overflow-hidden transform transition-all">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <h3 class="font-bold text-slate-800 text-lg">Detail osoby</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-200/50 transition-all">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                <input type="hidden" id="edit-id">

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Jméno</label>
                        <input type="text" id="edit-givenName" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-slate-400 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Příjmení</label>
                        <input type="text" id="edit-surname" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-slate-400 transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Pohlaví</label>
                        <select id="edit-sex" onchange="toggleMaidenNameField()" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-slate-400 transition-all bg-white">
                            <option value="M">Muž</option>
                            <option value="F">Žena</option>
                        </select>
                    </div>
                    <div id="maiden-name-container">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Rodné příjmení</label>
                        <input type="text" id="edit-maidenName" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-slate-400 transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 pt-2 border-t border-slate-100">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Datum narození</label>
                        <input type="text" id="edit-birthDate" placeholder="např. 12 MAY 1920" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-slate-400 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Datum úmrtí</label>
                        <input type="text" id="edit-deathDate" placeholder="např. 05 JAN 1998" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-slate-400 transition-all">
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-100">
                    <label class="block text-xs font-semibold text-slate-600 mb-2">Vazby a rodina</label>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="addRelative('father')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg flex items-center space-x-1 transition-all">
                            <i data-lucide="plus" class="w-3 h-3"></i>
                            <span>Přidat otce</span>
                        </button>
                        <button onclick="addRelative('mother')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg flex items-center space-x-1 transition-all">
                            <i data-lucide="plus" class="w-3 h-3"></i>
                            <span>Přidat matku</span>
                        </button>
                        <button onclick="addRelative('child')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg flex items-center space-x-1 transition-all">
                            <i data-lucide="plus" class="w-3 h-3"></i>
                            <span>Přidat dítě</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
                <button onclick="deleteCurrentPerson()" class="px-3 py-1.5 text-red-600 hover:bg-red-50 text-xs font-medium rounded-lg transition-all flex items-center space-x-1">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    <span>Smazat osobu</span>
                </button>
                <div class="flex items-center space-x-2">
                    <button onclick="closeModal()" class="px-4 py-2 border border-slate-300 text-slate-700 hover:bg-slate-100 text-sm font-medium rounded-lg transition-all">
                        Zrušit
                    </button>
                    <button onclick="savePersonModal()" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium rounded-lg transition-all">
                        Uložit změny
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // State
        let persons = {};
        let families = {};
        let activePersonId = null;
        let currentViewMode = 'ancestors'; // ancestors, descendants, all
        let currentTemplate = 'nordic';

        // Pan Zoom variables
        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        // Node Dimensions
        const CARD_WIDTH = 220;
        const CARD_HEIGHT = 90;
        const GAP_X = 50;
        const GAP_Y = 80;

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            setupPanZoom();
            updateEmptyState();
        });

        // Toggle Maiden Name Field
        function toggleMaidenNameField() {
            const sex = document.getElementById('edit-sex').value;
            const container = document.getElementById('maiden-name-container');
            if (sex === 'F') {
                container.classList.remove('opacity-40', 'pointer-events-none');
            } else {
                container.classList.add('opacity-40', 'pointer-events-none');
            }
        }

        // GEDCOM Parser
        function parseGedcom(text) {
            const lines = text.split(/\r?\n/);
            const newPersons = {};
            const newFamilies = {};

            let currentRecord = null;
            let currentType = null;

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;

                const match = line.match(/^(\d+)\s+(@[^@]+@|[^\s]+)\s*(.*)$/);
                if (!match) continue;

                const level = parseInt(match[1]);
                const tagOrId = match[2];
                const value = match[3];

                if (level === 0) {
                    if (value === 'INDI') {
                        currentType = 'INDI';
                        currentRecord = {
                            id: tagOrId,
                            givenName: '',
                            surname: '',
                            maidenName: '',
                            sex: 'M',
                            birthDate: '',
                            deathDate: '',
                            famc: null,
                            fams: []
                        };
                        newPersons[tagOrId] = currentRecord;
                    } else if (value === 'FAM') {
                        currentType = 'FAM';
                        currentRecord = {
                            id: tagOrId,
                            husband: null,
                            wife: null,
                            children: []
                        };
                        newFamilies[tagOrId] = currentRecord;
                    } else {
                        currentType = null;
                        currentRecord = null;
                    }
                } else if (currentRecord && level === 1) {
                    if (currentType === 'INDI') {
                        if (tagOrId === 'NAME') {
                            const nameMatch = value.match(/(.*?)\/(.*?)\//);
                            if (nameMatch) {
                                currentRecord.givenName = nameMatch[1].trim();
                                currentRecord.surname = nameMatch[2].trim();
                            } else {
                                currentRecord.givenName = value.trim();
                            }
                        } else if (tagOrId === 'SEX') {
                            currentRecord.sex = value.trim().toUpperCase();
                        } else if (tagOrId === 'FAMC') {
                            currentRecord.famc = value.trim();
                        } else if (tagOrId === 'FAMS') {
                            currentRecord.fams.push(value.trim());
                        } else if (tagOrId === '_MAIDEN' || tagOrId === '_MARNM') {
                            currentRecord.maidenName = value.trim();
                        }
                    } else if (currentType === 'FAM') {
                        if (tagOrId === 'HUSB') currentRecord.husband = value.trim();
                        if (tagOrId === 'WIFE') currentRecord.wife = value.trim();
                        if (tagOrId === 'CHIL') currentRecord.children.push(value.trim());
                    }
                } else if (currentRecord && level === 2) {
                    if (currentType === 'INDI') {
                        if (tagOrId === 'DATE') {
                            // Simple heuristic based on parent tag context if needed, 
                            // here we check if birth/death were preceding tag
                        }
                    }
                }
            }

            // Second pass for birth / death dates
            let lastTag = '';
            for (let line of lines) {
                line = line.trim();
                const match = line.match(/^(\d+)\s+([^\s]+)\s*(.*)$/);
                if (!match) continue;
                const level = parseInt(match[1]);
                const tag = match[2];
                const val = match[3];

                if (level === 0) {
                    currentRecord = newPersons[tag] || newFamilies[tag] || null;
                } else if (level === 1) {
                    lastTag = tag;
                } else if (level === 2 && tag === 'DATE' && currentRecord && currentRecord.givenName !== undefined) {
                    if (lastTag === 'BIRT') currentRecord.birthDate = val;
                    if (lastTag === 'DEAT') currentRecord.deathDate = val;
                }
            }

            // Extract Maiden name heuristic if female and missing
            Object.values(newPersons).forEach(p => {
                if (p.sex === 'F' && !p.maidenName && p.surname) {
                    p.maidenName = p.surname;
                }
            });

            return { persons: newPersons, families: newFamilies };
        }

        // GEDCOM Export
        function exportGedcom() {
            let ged = "0 HEAD\n1 SOUR RodokmenStudio\n1 GEDC\n2 VERS 5.5.1\n2 FORM LINEAGE-LINKED\n1 CHAR UTF-8\n";

            Object.values(persons).forEach(p => {
                ged += `0 ${p.id} INDI\n`;
                ged += `1 NAME ${p.givenName} /${p.surname}/\n`;
                if (p.sex) ged += `1 SEX ${p.sex}\n`;
                if (p.maidenName) ged += `1 _MAIDEN ${p.maidenName}\n`;
                if (p.birthDate) ged += `1 BIRT\n2 DATE ${p.birthDate}\n`;
                if (p.deathDate) ged += `1 DEAT\n2 DATE ${p.deathDate}\n`;
                if (p.famc) ged += `1 FAMC ${p.famc}\n`;
                (p.fams || []).forEach(f => { ged += `1 FAMS ${f}\n`; });
            });

            Object.values(families).forEach(f => {
                ged += `0 ${f.id} FAM\n`;
                if (f.husband) ged += `1 HUSB ${f.husband}\n`;
                if (f.wife) ged += `1 WIFE ${f.wife}\n`;
                (f.children || []).forEach(c => { ged += `1 CHIL ${c}\n`; });
            });

            ged += "0 TRLR\n";

            const blob = new Blob([ged], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'rodokmen.ged';
            link.click();
        }

        // File Upload Handler
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const parsed = parseGedcom(content);
                persons = parsed.persons;
                families = parsed.families;

                const keys = Object.keys(persons);
                if (keys.length > 0) {
                    activePersonId = keys[0];
                } else {
                    activePersonId = null;
                }

                updateEmptyState();
                renderPersonList();
                renderTree();
                resetZoom();
            };
            reader.readAsText(file);
        }

        // Render Person Sidebar List
        function renderPersonList() {
            const container = document.getElementById('person-list');
            const search = document.getElementById('search-input').value.toLowerCase();
            document.getElementById('person-count').innerText = Object.keys(persons).length;

            container.innerHTML = '';

            const sorted = Object.values(persons).sort((a,b) => {
                const nameA = `${a.surname} ${a.givenName}`.toLowerCase();
                const nameB = `${b.surname} ${b.givenName}`.toLowerCase();
                return nameA.localeCompare(nameB);
            });

            sorted.forEach(p => {
                const fullName = `${p.givenName} ${p.surname}`.toLowerCase();
                if (search && !fullName.includes(search)) return;

                const isActive = p.id === activePersonId;
                const div = document.createElement('div');
                div.className = `p-3 flex items-center justify-between cursor-pointer transition-all ${
                    isActive ? 'bg-slate-100 border-l-4 border-slate-900' : 'hover:bg-slate-50'
                }`;
                
                const dates = [p.birthDate, p.deathDate].filter(Boolean).join(' - ') || 'Bez datumu';
                const maiden = (p.sex === 'F' && p.maidenName) ? ` (${p.maidenName})` : '';

                div.innerHTML = `
                    <div class="overflow-hidden pr-2" onclick="setActivePerson('${p.id}')">
                        <div class="font-medium text-slate-800 text-sm truncate">
                            ${p.givenName || 'Neznámé'} <span class="font-bold">${p.surname || ''}</span>
                            <span class="text-xs text-slate-400 font-normal">${maiden}</span>
                        </div>
                        <div class="text-xs text-slate-400 truncate">${dates}</div>
                    </div>
                    <div class="flex items-center space-x-1">
                        <button onclick="openEditModal('${p.id}'); event.stopPropagation();" class="p-1 hover:bg-slate-200 rounded text-slate-400 hover:text-slate-700">
                            <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;

                container.appendChild(div);
            });

            lucide.createIcons();
        }

        function setActivePerson(id) {
            activePersonId = id;
            renderPersonList();
            renderTree();
        }

        function setViewMode(mode) {
            currentViewMode = mode;
            ['ancestors', 'descendants', 'all'].forEach(m => {
                const btn = document.getElementById(`btn-view-${m}`);
                if (m === mode) {
                    btn.className = "px-3 py-1.5 rounded-md font-medium transition-all bg-white shadow-sm text-slate-900";
                } else {
                    btn.className = "px-3 py-1.5 rounded-md font-medium text-slate-600 hover:text-slate-900 transition-all";
                }
            });
            renderTree();
            resetZoom();
        }

        function changeTemplate(tpl) {
            currentTemplate = tpl;
            renderTree();
        }

        // Layout Engine & Tree Rendering
        function renderTree() {
            const linesGroup = document.getElementById('lines-group');
            const nodesGroup = document.getElementById('nodes-group');
            linesGroup.innerHTML = '';
            nodesGroup.innerHTML = '';

            if (!activePersonId || !persons[activePersonId]) return;

            let nodes = [];
            let connections = [];

            if (currentViewMode === 'ancestors') {
                const layout = buildAncestorsLayout(activePersonId);
                nodes = layout.nodes;
                connections = layout.connections;
            } else if (currentViewMode === 'descendants') {
                const layout = buildDescendantsLayout(activePersonId);
                nodes = layout.nodes;
                connections = layout.connections;
            } else {
                const layout = buildAllTreeLayout();
                nodes = layout.nodes;
                connections = layout.connections;
            }

            // Draw Connections (Lines)
            connections.forEach(conn => {
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                const midY = (conn.y1 + conn.y2) / 2;
                const d = `M ${conn.x1} ${conn.y1} C ${conn.x1} ${midY}, ${conn.x2} ${midY}, ${conn.x2} ${conn.y2}`;
                
                path.setAttribute("d", d);
                path.setAttribute("fill", "none");
                path.setAttribute("stroke", currentTemplate === 'minimal' ? '#94a3b8' : '#cbd5e1');
                path.setAttribute("stroke-width", "2");
                linesGroup.appendChild(path);
            });

            // Draw Nodes (Cards)
            nodes.forEach(node => {
                const p = persons[node.id];
                if (!p) return;

                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("transform", `translate(${node.x}, ${node.y})`);
                g.setAttribute("class", "cursor-pointer");
                g.onclick = () => openEditModal(node.id);

                // Styling based on template
                let cardBg = "#ffffff";
                let cardBorder = "#e2e8f0";
                let textPrimary = "#0f172a";
                let textSecondary = "#64748b";
                let accentBar = null;

                if (currentTemplate === 'slate') {
                    cardBorder = "#cbd5e1";
                    accentBar = p.sex === 'F' ? "#ec4899" : "#3b82f6";
                } else if (currentTemplate === 'minimal') {
                    cardBorder = "#94a3b8";
                }

                if (node.id === activePersonId) {
                    cardBorder = "#0f172a";
                }

                // Card background rect
                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("width", CARD_WIDTH);
                rect.setAttribute("height", CARD_HEIGHT);
                rect.setAttribute("rx", "10");
                rect.setAttribute("fill", cardBg);
                rect.setAttribute("stroke", cardBorder);
                rect.setAttribute("stroke-width", node.id === activePersonId ? "2.5" : "1.5");
                rect.setAttribute("class", "shadow-sm hover:shadow-md transition-all");
                g.appendChild(rect);

                // Accent Bar for Slate template
                if (accentBar) {
                    const bar = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                    bar.setAttribute("width", "4");
                    bar.setAttribute("height", CARD_HEIGHT - 12);
                    bar.setAttribute("x", "6");
                    bar.setAttribute("y", "6");
                    bar.setAttribute("rx", "2");
                    bar.setAttribute("fill", accentBar);
                    g.appendChild(bar);
                }

                // Name Text
                const nameText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                nameText.setAttribute("x", accentBar ? "20" : "16");
                nameText.setAttribute("y", "28");
                nameText.setAttribute("font-size", "14");
                nameText.setAttribute("font-weight", "700");
                nameText.setAttribute("fill", textPrimary);
                nameText.textContent = `${p.givenName || ''} ${p.surname || ''}`;
                g.appendChild(nameText);

                // Maiden Name (if female)
                let currentY = 46;
                if (p.sex === 'F' && p.maidenName) {
                    const maidenText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    maidenText.setAttribute("x", accentBar ? "20" : "16");
                    maidenText.setAttribute("y", currentY);
                    maidenText.setAttribute("font-size", "11");
                    maidenText.setAttribute("fill", textSecondary);
                    maidenText.textContent = `rodná: ${p.maidenName}`;
                    g.appendChild(maidenText);
                    currentY += 18;
                }

                // Dates
                const dates = [p.birthDate ? `* ${p.birthDate}` : '', p.deathDate ? `+ ${p.deathDate}` : ''].filter(Boolean).join(' ');
                if (dates) {
                    const dateText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    dateText.setAttribute("x", accentBar ? "20" : "16");
                    dateText.setAttribute("y", currentY + 4);
                    dateText.setAttribute("font-size", "11");
                    dateText.setAttribute("fill", textSecondary);
                    dateText.textContent = dates;
                    g.appendChild(dateText);
                }

                nodesGroup.appendChild(g);
            });
        }

        // Layout: Ancestors (Vývod)
        function buildAncestorsLayout(rootId) {
            const nodes = [];
            const connections = [];

            function traverse(id, level, xOffset) {
                if (!id || !persons[id]) return null;
                const p = persons[id];

                const y = -level * (CARD_HEIGHT + GAP_Y);
                const node = { id, x: xOffset, y };
                nodes.push(node);

                if (p.famc && families[p.famc]) {
                    const fam = families[p.famc];
                    const width = Math.max(1, Math.pow(2, 3 - level)) * (CARD_WIDTH + GAP_X) / 2;

                    let fatherNode = null;
                    let motherNode = null;

                    if (fam.husband) {
                        fatherNode = traverse(fam.husband, level + 1, xOffset - width / 2);
                    }
                    if (fam.wife) {
                        motherNode = traverse(fam.wife, level + 1, xOffset + width / 2);
                    }

                    if (fatherNode) {
                        connections.push({
                            x1: node.x + CARD_WIDTH / 2, y1: node.y,
                            x2: fatherNode.x + CARD_WIDTH / 2, y2: fatherNode.y + CARD_HEIGHT
                        });
                    }
                    if (motherNode) {
                        connections.push({
                            x1: node.x + CARD_WIDTH / 2, y1: node.y,
                            x2: motherNode.x + CARD_WIDTH / 2, y2: motherNode.y + CARD_HEIGHT
                        });
                    }
                }

                return node;
            }

            traverse(rootId, 0, 0);
            return { nodes, connections };
        }

        // Layout: Descendants (Rozrod)
        function buildDescendantsLayout(rootId) {
            const nodes = [];
            const connections = [];

            function traverse(id, level, startX) {
                if (!id || !persons[id]) return { node: null, width: 0 };
                const p = persons[id];

                const fams = p.fams || [];
                let children = [];
                fams.forEach(fId => {
                    if (families[fId] && families[fId].children) {
                        children = children.concat(families[fId].children);
                    }
                });

                if (children.length === 0) {
                    const y = level * (CARD_HEIGHT + GAP_Y);
                    const node = { id, x: startX, y };
                    nodes.push(node);
                    return { node, width: CARD_WIDTH + GAP_X };
                }

                let currentX = startX;
                const childNodes = [];

                children.forEach(cId => {
                    const res = traverse(cId, level + 1, currentX);
                    if (res.node) childNodes.push(res.node);
                    currentX += Math.max(res.width, CARD_WIDTH + GAP_X);
                });

                const totalWidth = currentX - startX;
                const nodeX = startX + (totalWidth / 2) - (CARD_WIDTH / 2);
                const node = { id, x: nodeX, y: level * (CARD_HEIGHT + GAP_Y) };
                nodes.push(node);

                childNodes.forEach(cNode => {
                    connections.push({
                        x1: node.x + CARD_WIDTH / 2, y1: node.y + CARD_HEIGHT,
                        x2: cNode.x + CARD_WIDTH / 2, y2: cNode.y
                    });
                });

                return { node, width: totalWidth };
            }

            traverse(rootId, 0, 0);
            return { nodes, connections };
        }

        // Layout: All Tree (Celý rodokmen)
        function buildAllTreeLayout() {
            const nodes = [];
            const connections = [];
            const levels = {};

            // Calculate level/generation for all persons
            Object.keys(persons).forEach(id => { levels[id] = 0; });

            let changed = true;
            let iter = 0;
            while (changed && iter < 10) {
                changed = false;
                iter++;
                Object.values(families).forEach(fam => {
                    const hLevel = fam.husband ? levels[fam.husband] : null;
                    const wLevel = fam.wife ? levels[fam.wife] : null;
                    const parentLevel = Math.max(hLevel || 0, wLevel || 0);

                    (fam.children || []).forEach(cId => {
                        if (levels[cId] !== parentLevel + 1) {
                            levels[cId] = parentLevel + 1;
                            changed = true;
                        }
                    });
                });
            }

            // Group by level
            const levelGroups = {};
            Object.keys(persons).forEach(id => {
                const lvl = levels[id];
                if (!levelGroups[lvl]) levelGroups[lvl] = [];
                levelGroups[lvl].push(id);
            });

            // Position nodes in rows
            Object.keys(levelGroups).forEach(lvlStr => {
                const lvl = parseInt(lvlStr);
                const pIds = levelGroups[lvl];
                const totalRowWidth = pIds.length * (CARD_WIDTH + GAP_X);
                let startX = -totalRowWidth / 2;

                pIds.forEach(id => {
                    nodes.push({
                        id,
                        x: startX,
                        y: lvl * (CARD_HEIGHT + GAP_Y)
                    });
                    startX += CARD_WIDTH + GAP_X;
                });
            });

            // Map connections
            const nodeMap = {};
            nodes.forEach(n => { nodeMap[n.id] = n; });

            Object.values(families).forEach(fam => {
                const parents = [fam.husband, fam.wife].filter(Boolean);
                (fam.children || []).forEach(cId => {
                    const cNode = nodeMap[cId];
                    if (!cNode) return;

                    parents.forEach(pId => {
                        const pNode = nodeMap[pId];
                        if (pNode) {
                            connections.push({
                                x1: pNode.x + CARD_WIDTH / 2, y1: pNode.y + CARD_HEIGHT,
                                x2: cNode.x + CARD_WIDTH / 2, y2: cNode.y
                            });
                        }
                    });
                });
            });

            return { nodes, connections };
        }

        // Pan Zoom Logic
        function setupPanZoom() {
            const svg = document.getElementById('tree-svg');

            svg.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'svg' || e.target.id === 'lines-group') {
                    isDragging = true;
                    startX = e.clientX - panX;
                    startY = e.clientY - panY;
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    panX = e.clientX - startX;
                    panY = e.clientY - startY;
                    updateViewportTransform();
                }
            });

            window.addEventListener('mouseup', () => { isDragging = false; });

            svg.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
                scale = Math.min(Math.max(0.2, scale * zoomFactor), 3);
                updateViewportTransform();
            });
        }

        function updateViewportTransform() {
            const viewport = document.getElementById('viewport');
            viewport.setAttribute('transform', `translate(${panX}, ${panY}) scale(${scale})`);
        }

        function zoomIn() { scale = Math.min(3, scale * 1.2); updateViewportTransform(); }
        function zoomOut() { scale = Math.max(0.2, scale / 1.2); updateViewportTransform(); }
        function resetZoom() {
            const wrapper = document.getElementById('canvas-wrapper');
            panX = wrapper.clientWidth / 2 - CARD_WIDTH / 2;
            panY = wrapper.clientHeight / 2 - CARD_HEIGHT / 2;
            scale = 1;
            updateViewportTransform();
        }

        // Modal Controls
        function openEditModal(id) {
            const p = persons[id];
            if (!p) return;

            document.getElementById('edit-id').value = p.id;
            document.getElementById('edit-givenName').value = p.givenName || '';
            document.getElementById('edit-surname').value = p.surname || '';
            document.getElementById('edit-sex').value = p.sex || 'M';
            document.getElementById('edit-maidenName').value = p.maidenName || '';
            document.getElementById('edit-birthDate').value = p.birthDate || '';
            document.getElementById('edit-deathDate').value = p.deathDate || '';

            toggleMaidenNameField();
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        function savePersonModal() {
            const id = document.getElementById('edit-id').value;
            if (!persons[id]) return;

            persons[id].givenName = document.getElementById('edit-givenName').value;
            persons[id].surname = document.getElementById('edit-surname').value;
            persons[id].sex = document.getElementById('edit-sex').value;
            persons[id].maidenName = document.getElementById('edit-maidenName').value;
            persons[id].birthDate = document.getElementById('edit-birthDate').value;
            persons[id].deathDate = document.getElementById('edit-deathDate').value;

            closeModal();
            renderPersonList();
            renderTree();
        }

        function createNewPerson() {
            const newId = `@I${Date.now()}@`;
            persons[newId] = {
                id: newId,
                givenName: 'Nová',
                surname: 'Osoba',
                sex: 'M',
                maidenName: '',
                birthDate: '',
                deathDate: '',
                famc: null,
                fams: []
            };

            activePersonId = newId;
            updateEmptyState();
            renderPersonList();
            openEditModal(newId);
        }

        function deleteCurrentPerson() {
            const id = document.getElementById('edit-id').value;
            if (confirm('Opravdu chcete tuto osobu smazat?')) {
                delete persons[id];
                closeModal();
                const keys = Object.keys(persons);
                activePersonId = keys.length > 0 ? keys[0] : null;
                updateEmptyState();
                renderPersonList();
                renderTree();
            }
        }

        function addRelative(type) {
            const currentId = document.getElementById('edit-id').value;
            const newId = `@I${Date.now()}@`;

            persons[newId] = {
                id: newId,
                givenName: type === 'father' ? 'Otec' : type === 'mother' ? 'Matka' : 'Dítě',
                surname: persons[currentId].surname || '',
                sex: type === 'mother' ? 'F' : 'M',
                maidenName: '',
                birthDate: '',
                deathDate: '',
                famc: null,
                fams: []
            };

            // Link in families
            let famId = persons[currentId].famc;
            if (!famId && (type === 'father' || type === 'mother')) {
                famId = `@F${Date.now()}@`;
                families[famId] = { id: famId, husband: null, wife: null, children: [currentId] };
                persons[currentId].famc = famId;
            }

            if (type === 'father' && famId) families[famId].husband = newId;
            if (type === 'mother' && famId) families[famId].wife = newId;

            closeModal();
            renderPersonList();
            renderTree();
            openEditModal(newId);
        }

        function updateEmptyState() {
            const isEmpty = Object.keys(persons).length === 0;
            document.getElementById('empty-state').style.display = isEmpty ? 'flex' : 'none';
        }

        // SVG Export
        function exportSVG() {
            const svg = document.getElementById('tree-svg');
            const serializer = new XMLSerializer();
            let source = serializer.serializeToString(svg);

            if (!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
                source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
            }

            const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(source);
            const downloadLink = document.createElement("a");
            downloadLink.href = url;
            downloadLink.download = "rodokmen.svg";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
