<!DOCTYPE html>
<html lang="cs" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikace Rodokmen - Ležaté přesýpací hodiny</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.3);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.5);
    }

    /* Print / Poster Style Overrides */
    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background: white !important;
        color: black !important;
      }
      #canvas-container {
        overflow: visible !important;
        background: white !important;
      }
    }

    .poster-theme {
      background-color: #fcfbf7 !important;
      background-image: radial-gradient(#e5e0d8 1px, transparent 1px) !important;
      background-size: 24px 24px !important;
    }

    .poster-theme .node-card {
      box-shadow: 0 4px 20px -2px rgba(120, 80, 40, 0.15) !important;
      border-color: #d4af37 !important;
    }
  </style>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex flex-col font-sans transition-colors duration-200">

  <!-- TOP NAVBAR -->
  <header class="no-print bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 py-2.5 flex items-center justify-between z-30 shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="p-2 bg-brand-500 text-white rounded-lg shadow-md">
        <i data-lucide="git-fork" class="w-5 h-5 rotate-90"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight tracking-tight text-slate-900 dark:text-white">Rodokmen</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">Layout ležatých přesýpacích hodin</p>
      </div>
    </div>

    <!-- Controls Toolbar -->
    <div class="flex items-center space-x-2">
      <!-- Import / Export GEDCOM -->
      <label class="cursor-pointer bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-3 py-1.5 rounded-lg text-sm font-medium flex items-center space-x-1.5 transition-colors">
        <i data-lucide="upload" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Načíst GEDCOM</span>
        <input type="file" id="gedcom-input" accept=".ged,.gedcom" class="hidden" onchange="handleGedcomImport(event)">
      </label>

      <button onclick="exportGedcom()" class="bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-3 py-1.5 rounded-lg text-sm font-medium flex items-center space-x-1.5 transition-colors">
        <i data-lucide="download" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Export GEDCOM</span>
      </button>

      <div class="h-6 w-px bg-slate-300 dark:bg-slate-700 mx-1"></div>

      <!-- Add Root Person -->
      <button onclick="addNewPerson()" class="bg-brand-600 hover:bg-brand-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium flex items-center space-x-1.5 shadow-sm transition-colors">
        <i data-lucide="user-plus" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Nová osoba</span>
      </button>

      <div class="h-6 w-px bg-slate-300 dark:bg-slate-700 mx-1"></div>

      <!-- Theme & Poster Mode Toggle -->
      <button onclick="togglePosterStyle()" id="poster-btn" class="bg-amber-100 hover:bg-amber-200 dark:bg-amber-900/40 text-amber-900 dark:text-amber-200 border border-amber-300 dark:border-amber-700 px-3 py-1.5 rounded-lg text-sm font-medium flex items-center space-x-1.5 transition-colors">
        <i data-lucide="award" class="w-4 h-4"></i>
        <span class="hidden md:inline">Plakátový styl</span>
      </button>

      <button onclick="exportSVG()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium flex items-center space-x-1.5 shadow-sm transition-colors">
        <i data-lucide="file-down" class="w-4 h-4"></i>
        <span class="hidden md:inline">Export SVG</span>
      </button>

      <button onclick="toggleDarkMode()" class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
        <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
        <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <div class="flex-1 flex overflow-hidden relative">
    
    <!-- CANVAS VIEWPORT -->
    <main id="canvas-container" class="flex-1 overflow-auto relative cursor-grab active:cursor-grabbing select-none">
      
      <!-- SVG Lines Overlay -->
      <svg id="svg-tree" class="absolute top-0 left-0 w-full h-full pointer-events-none z-0 overflow-visible" style="min-width: 3000px; min-height: 3000px;"></svg>

      <!-- HTML Nodes Container -->
      <div id="tree-nodes" class="absolute top-0 left-0 z-10" style="min-width: 3000px; min-height: 3000px;"></div>

    </main>

    <!-- RIGHT EDIT SIDEBAR -->
    <aside id="edit-sidebar" class="no-print w-80 sm:w-96 bg-white dark:bg-slate-800 border-l border-slate-200 dark:border-slate-700 flex flex-col z-20 shadow-xl transition-all duration-300 transform translate-x-full absolute right-0 top-0 bottom-0">
      <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between bg-slate-50 dark:bg-slate-800/50">
        <h2 class="font-bold text-slate-800 dark:text-white flex items-center space-x-2">
          <i data-lucide="user-cog" class="w-5 h-5 text-brand-500"></i>
          <span>Detail Osoby</span>
        </h2>
        <button onclick="closeSidebar()" class="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-4 space-y-5">
        <input type="hidden" id="edit-id">

        <!-- Name Inputs -->
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 dark:text-slate-400 mb-1">Jméno</label>
          <input type="text" id="edit-givenName" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-900 dark:border-slate-700 focus:ring-2 focus:ring-brand-500 outline-none text-sm">
        </div>
        
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 dark:text-slate-400 mb-1">Příjmení</label>
          <input type="text" id="edit-surname" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-900 dark:border-slate-700 focus:ring-2 focus:ring-brand-500 outline-none text-sm font-semibold">
        </div>

        <!-- Gender Selection -->
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 dark:text-slate-400 mb-1">Pohlaví</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="setEditGender('M')" id="btn-gender-M" class="py-2 px-3 border rounded-lg text-sm font-medium flex items-center justify-center space-x-2 transition-colors">
              <i data-lucide="mars" class="w-4 h-4 text-blue-500"></i>
              <span>Muž</span>
            </button>
            <button type="button" onclick="setEditGender('F')" id="btn-gender-F" class="py-2 px-3 border rounded-lg text-sm font-medium flex items-center justify-center space-x-2 transition-colors">
              <i data-lucide="venus" class="w-4 h-4 text-pink-500"></i>
              <span>Žena</span>
            </button>
          </div>
        </div>

        <!-- Czech Date Picker: Narození -->
        <div class="bg-slate-50 dark:bg-slate-900/50 p-3 rounded-lg border border-slate-200 dark:border-slate-700/60">
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-2 flex items-center space-x-1">
            <i data-lucide="baby" class="w-4 h-4 text-emerald-500"></i>
            <span>Datum Narození</span>
          </label>
          <div class="grid grid-cols-3 gap-1.5">
            <div>
              <span class="text-[10px] text-slate-400 block mb-0.5">Den</span>
              <select id="edit-birth-day" class="w-full px-1.5 py-1.5 text-xs border rounded dark:bg-slate-800 dark:border-slate-700">
                <option value="">--</option>
              </select>
            </div>
            <div>
              <span class="text-[10px] text-slate-400 block mb-0.5">Měsíc</span>
              <select id="edit-birth-month" class="w-full px-1.5 py-1.5 text-xs border rounded dark:bg-slate-800 dark:border-slate-700">
                <option value="">--</option>
              </select>
            </div>
            <div>
              <span class="text-[10px] text-slate-400 block mb-0.5">Rok</span>
              <input type="number" id="edit-birth-year" placeholder="1890" class="w-full px-2 py-1.5 text-xs border rounded dark:bg-slate-800 dark:border-slate-700">
            </div>
          </div>
          <input type="text" id="edit-birth-place" placeholder="Místo narození..." class="w-full mt-2 px-2.5 py-1.5 text-xs border rounded dark:bg-slate-900 dark:border-slate-700">
        </div>

        <!-- Czech Date Picker: Úmrtí -->
        <div class="bg-slate-50 dark:bg-slate-900/50 p-3 rounded-lg border border-slate-200 dark:border-slate-700/60">
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-2 flex items-center space-x-1">
            <i data-lucide="cross" class="w-4 h-4 text-slate-400"></i>
            <span>Datum Úmrtí</span>
          </label>
          <div class="grid grid-cols-3 gap-1.5">
            <div>
              <span class="text-[10px] text-slate-400 block mb-0.5">Den</span>
              <select id="edit-death-day" class="w-full px-1.5 py-1.5 text-xs border rounded dark:bg-slate-800 dark:border-slate-700">
                <option value="">--</option>
              </select>
            </div>
            <div>
              <span class="text-[10px] text-slate-400 block mb-0.5">Měsíc</span>
              <select id="edit-death-month" class="w-full px-1.5 py-1.5 text-xs border rounded dark:bg-slate-800 dark:border-slate-700">
                <option value="">--</option>
              </select>
            </div>
            <div>
              <span class="text-[10px] text-slate-400 block mb-0.5">Rok</span>
              <input type="number" id="edit-death-year" placeholder="1965" class="w-full px-2 py-1.5 text-xs border rounded dark:bg-slate-800 dark:border-slate-700">
            </div>
          </div>
          <input type="text" id="edit-death-place" placeholder="Místo úmrtí..." class="w-full mt-2 px-2.5 py-1.5 text-xs border rounded dark:bg-slate-800 dark:border-slate-700">
        </div>

        <!-- Spouse Actions -->
        <div class="pt-2 border-t border-slate-200 dark:border-slate-700 space-y-2">
          <label class="block text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">Rodinné vazby</label>
          
          <!-- Dynamic Button for Adding Partner -->
          <button type="button" onclick="addSpouseToCurrent()" id="btn-add-spouse" class="w-full py-2 px-3 bg-purple-50 hover:bg-purple-100 dark:bg-purple-950/40 dark:hover:bg-purple-900/50 text-purple-700 dark:text-purple-300 border border-purple-200 dark:border-purple-800 rounded-lg text-xs font-medium flex items-center justify-center space-x-2 transition-colors">
            <i data-lucide="heart-handshake" class="w-4 h-4"></i>
            <span id="btn-add-spouse-text">Přidat manžela / manželku</span>
          </button>

          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="addParentToCurrent('M')" class="py-1.5 px-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded text-xs flex items-center justify-center space-x-1">
              <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
              <span>Přidat Otce</span>
            </button>
            <button type="button" onclick="addParentToCurrent('F')" class="py-1.5 px-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded text-xs flex items-center justify-center space-x-1">
              <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
              <span>Přidat Matku</span>
            </button>
          </div>
        </div>

      </div>

      <!-- Action Buttons -->
      <div class="p-4 border-t border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 flex space-x-2">
        <button onclick="savePersonChanges()" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-medium py-2 rounded-lg text-sm shadow-md transition-colors flex items-center justify-center space-x-1">
          <i data-lucide="check" class="w-4 h-4"></i>
          <span>Uložit změny</span>
        </button>
        <button onclick="deletePerson()" class="px-3 py-2 bg-red-100 hover:bg-red-200 dark:bg-red-950/50 dark:hover:bg-red-900 text-red-600 dark:text-red-300 rounded-lg text-sm font-medium transition-colors">
          <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>
      </div>
    </aside>

  </div>

  <!-- JAVASCRIPT APPLICATION LOGIC -->
  <script>
    // --- CZECH MONTH DEFINITIONS ---
    const CZECH_MONTHS = [
      { num: 1, name: "Leden", gedcom: "JAN" },
      { num: 2, name: "Únor", gedcom: "FEB" },
      { num: 3, name: "Březen", gedcom: "MAR" },
      { num: 4, name: "Duben", gedcom: "APR" },
      { num: 5, name: "Květen", gedcom: "MAY" },
      { num: 6, name: "Červen", gedcom: "JUN" },
      { num: 7, name: "Červenec", gedcom: "JUL" },
      { num: 8, name: "Srpen", gedcom: "AUG" },
      { num: 9, name: "Září", gedcom: "SEP" },
      { num: 10, name: "Říjen", gedcom: "OCT" },
      { num: 11, name: "Listopad", gedcom: "NOV" },
      { num: 12, name: "Prosinec", gedcom: "DEC" }
    ];

    // --- APPLICATION STATE ---
    let people = {};      // Dictionary of Individuals keyed by ID
    let families = {};    // Dictionary of Families (FAM) keyed by ID
    let rootPersonId = null;
    let selectedPersonId = null;
    let isPosterMode = false;

    // Default Initial Data Setup
    function initDefaultData() {
      people = {
        'I1': { id: 'I1', givenName: 'Jan', surname: 'Novák', sex: 'M', birth: { day: 15, month: 5, year: 1985, place: 'Praha' }, death: {}, famc: 'F1', fams: ['F2'] },
        'I2': { id: 'I2', givenName: 'Petr', surname: 'Novák', sex: 'M', birth: { day: 10, month: 3, year: 1958, place: 'Brno' }, death: {}, fams: ['F1'], famc: 'F3' },
        'I3': { id: 'I3', givenName: 'Marie', surname: 'Dvořáková', sex: 'F', birth: { day: 22, month: 8, year: 1960, place: 'Praha' }, death: {}, fams: ['F1'], famc: 'F4' },
        'I4': { id: 'I4', givenName: 'Eva', surname: 'Svobodová', sex: 'F', birth: { day: 1, month: 12, year: 1988, place: 'Plzeň' }, death: {}, fams: ['F2'], famc: null },
        // Father's ancestors (Left side)
        'I5': { id: 'I5', givenName: 'Josef', surname: 'Novák', sex: 'M', birth: { day: 4, month: 1, year: 1930, place: 'Brno' }, death: { year: 2005 }, fams: ['F3'] },
        'I6': { id: 'I6', givenName: 'Anna', surname: 'Černá', sex: 'F', birth: { day: 18, month: 9, year: 1934 }, death: { year: 2012 }, fams: ['F3'] },
        // Mother's ancestors (Right side)
        'I7': { id: 'I7', givenName: 'Karel', surname: 'Dvořák', sex: 'M', birth: { day: 30, month: 6, year: 1932 }, death: { year: 1999 }, fams: ['F4'] },
        'I8': { id: 'I8', givenName: 'Vlasta', surname: 'Veselá', sex: 'F', birth: { day: 11, month: 11, year: 1935 }, death: { year: 2018 }, fams: ['F4'] }
      };

      families = {
        'F1': { id: 'F1', husb: 'I2', wife: 'I3', chil: ['I1'] },
        'F2': { id: 'F2', husb: 'I1', wife: 'I4', chil: [] },
        'F3': { id: 'F3', husb: 'I5', wife: 'I6', chil: ['I2'] },
        'F4': { id: 'F4', husb: 'I7', wife: 'I8', chil: ['I3'] }
      };

      rootPersonId = 'I1';
    }

    // --- INITIALIZATION ---
    window.onload = function() {
      populateDateDropdowns();
      initDefaultData();
      renderTree();
      setupPanZoom();
      lucide.createIcons();
    };

    // Populate Czech Date Controls
    function populateDateDropdowns() {
      const birthDaySel = document.getElementById('edit-birth-day');
      const deathDaySel = document.getElementById('edit-death-day');
      const birthMonthSel = document.getElementById('edit-birth-month');
      const deathMonthSel = document.getElementById('edit-death-month');

      for (let i = 1; i <= 31; i++) {
        birthDaySel.innerHTML += `<option value="${i}">${i}.</option>`;
        deathDaySel.innerHTML += `<option value="${i}">${i}.</option>`;
      }

      CZECH_MONTHS.forEach(m => {
        birthMonthSel.innerHTML += `<option value="${m.num}">${m.name}</option>`;
        deathMonthSel.innerHTML += `<option value="${m.num}">${m.name}</option>`;
      });
    }

    // --- LAYOUT ENGINE: HORIZONTAL HOURGLASS LAYOUT ---
    // Core Layout Rules:
    // Root Person in exact center.
    // Left: Father Lineage (expanding to left -X).
    // Right: Mother Lineage (expanding to right +X).
    // Spouses/Partners stacked VERTICALLY above/below each other (Husband top, Wife bottom).

    const NODE_WIDTH = 200;
    const NODE_HEIGHT = 70;
    const X_SPACING = 280; // Distance between generations horizontally
    const Y_SPACING = 160; // Distance between vertical ancestors

    function renderTree() {
      const svg = document.getElementById('svg-tree');
      const container = document.getElementById('tree-nodes');
      svg.innerHTML = '';
      container.innerHTML = '';

      if (!rootPersonId || !people[rootPersonId]) return;

      const canvasWidth = 3000;
      const canvasHeight = 3000;
      const centerX = canvasWidth / 2;
      const centerY = canvasHeight / 2;

      const treePositions = {};

      // 1. Calculate positions using recursive layout engine
      // Active Root Person Center
      treePositions[rootPersonId] = { x: centerX - NODE_WIDTH / 2, y: centerY - NODE_HEIGHT / 2, person: people[rootPersonId] };

      const rootPerson = people[rootPersonId];
      const rootParentsFam = rootPerson.famc ? families[rootPerson.famc] : null;

      if (rootParentsFam) {
        // Father Branch -> Go Left (-X)
        if (rootParentsFam.husb) {
          layoutAncestors(rootParentsFam.husb, centerX - X_SPACING, centerY, -1, 1, treePositions);
        }
        // Mother Branch -> Go Right (+X)
        if (rootParentsFam.wife) {
          layoutAncestors(rootParentsFam.wife, centerX + X_SPACING, centerY, 1, 1, treePositions);
        }
      }

      // Also position spouses if any (stacked vertically)
      if (rootPerson.fams && rootPerson.fams.length > 0) {
        rootPerson.fams.forEach(famId => {
          const fam = families[famId];
          if (fam) {
            const spouseId = (fam.husb === rootPersonId) ? fam.wife : fam.husb;
            if (spouseId && people[spouseId] && !treePositions[spouseId]) {
              const rootPos = treePositions[rootPersonId];
              // Place spouse below or above based on gender
              const spouseY = rootPerson.sex === 'M' ? rootPos.y + NODE_HEIGHT + 24 : rootPos.y - NODE_HEIGHT - 24;
              treePositions[spouseId] = { x: rootPos.x, y: spouseY, person: people[spouseId] };
            }
          }
        });
      }

      // 2. Render SVG Connections & Coupling Nodes
      renderConnections(treePositions, svg);

      // 3. Render Node Cards HTML
      Object.keys(treePositions).forEach(id => {
        const item = treePositions[id];
        const card = createPersonCardHTML(item.person, item.x, item.y);
        container.appendChild(card);
      });

      lucide.createIcons();
    }

    // Recursive Ancestor Positioning engine
    function layoutAncestors(personId, currentX, currentY, directionX, level, positions) {
      const person = people[personId];
      if (!person) return;

      positions[personId] = { x: currentX - NODE_WIDTH / 2, y: currentY - NODE_HEIGHT / 2, person: person };

      const parentsFam = person.famc ? families[person.famc] : null;
      if (!parentsFam) return;

      const fatherId = parentsFam.husb;
      const motherId = parentsFam.wife;

      const offsetMultiplier = Math.max(0.4, 1 / Math.pow(1.6, level - 1));
      const spreadY = Y_SPACING * offsetMultiplier * 1.5;

      // Father stacked TOP, Mother stacked BOTTOM
      if (fatherId) {
        const fatherX = currentX + (directionX * X_SPACING);
        const fatherY = currentY - (spreadY / 2);
        layoutAncestors(fatherId, fatherX, fatherY, directionX, level + 1, positions);
      }

      if (motherId) {
        const motherX = currentX + (directionX * X_SPACING);
        const motherY = currentY + (spreadY / 2);
        layoutAncestors(motherId, motherX, motherY, directionX, level + 1, positions);
      }
    }

    // SVG Line Renderer with Couple Ties
    function renderConnections(positions, svg) {
      // Connect families
      Object.values(families).forEach(fam => {
        const husbPos = positions[fam.husb];
        const wifePos = positions[fam.wife];

        let coupleMidX = null;
        let coupleMidY = null;

        // Render Vertical Couple Line if both spouses are on canvas
        if (husbPos && wifePos) {
          const topNode = husbPos.y < wifePos.y ? husbPos : wifePos;
          const bottomNode = husbPos.y < wifePos.y ? wifePos : husbPos;

          const x1 = topNode.x + NODE_WIDTH / 2;
          const y1 = topNode.y + NODE_HEIGHT;
          const x2 = bottomNode.x + NODE_WIDTH / 2;
          const y2 = bottomNode.y;

          coupleMidX = x1;
          coupleMidY = (y1 + y2) / 2;

          // Vertical coupling line
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', x1);
          line.setAttribute('y1', y1);
          line.setAttribute('x2', x2);
          line.setAttribute('y2', y2);
          line.setAttribute('stroke', '#64748b');
          line.setAttribute('stroke-width', '2');
          line.setAttribute('stroke-dasharray', '3 3');
          svg.appendChild(line);

          // Central Couple Circle Connector
          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', coupleMidX);
          circle.setAttribute('cy', coupleMidY);
          circle.setAttribute('r', '5');
          circle.setAttribute('fill', '#0284c7');
          circle.setAttribute('stroke', '#ffffff');
          circle.setAttribute('stroke-width', '2');
          svg.appendChild(circle);
        }

        // Connect Children to Spouses
        if (fam.chil && fam.chil.length > 0) {
          fam.chil.forEach(childId => {
            const childPos = positions[childId];
            if (childPos) {
              let startX = coupleMidX;
              let startY = coupleMidY;

              if (!startX) {
                // If only one parent present
                const parentPos = husbPos || wifePos;
                if (parentPos) {
                  startX = parentPos.x + NODE_WIDTH / 2;
                  startY = parentPos.y + NODE_HEIGHT / 2;
                }
              }

              if (startX && startY) {
                const childCenterX = childPos.x + (childPos.x < startX ? NODE_WIDTH : 0);
                const childCenterY = childPos.y + NODE_HEIGHT / 2;

                // Orthogonal / Curved Path
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const midX = (startX + childCenterX) / 2;
                const d = `M ${startX} ${startY} C ${midX} ${startY}, ${midX} ${childCenterY}, ${childCenterX} ${childCenterY}`;
                
                path.setAttribute('d', d);
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke', isPosterMode ? '#d4af37' : '#94a3b8');
                path.setAttribute('stroke-width', '2');
                svg.appendChild(path);
              }
            }
          });
        }
      });
    }

    // Create Individual Node HTML
    function createPersonCardHTML(person, x, y) {
      const card = document.createElement('div');
      const isRoot = person.id === rootPersonId;
      const isMale = person.sex === 'M';

      card.className = `node-card absolute rounded-xl p-3 border transition-all duration-200 cursor-pointer shadow-md hover:shadow-xl flex flex-col justify-between ${
        isRoot 
          ? 'ring-4 ring-brand-500 ring-offset-2 dark:ring-offset-slate-900 bg-white dark:bg-slate-800 border-brand-500' 
          : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700'
      }`;

      card.style.width = `${NODE_WIDTH}px`;
      card.style.height = `${NODE_HEIGHT}px`;
      card.style.transform = `translate(${x}px, ${y}px)`;

      const genderBg = isMale ? 'bg-blue-100 text-blue-700 dark:bg-blue-950 dark:text-blue-300' : 'bg-pink-100 text-pink-700 dark:bg-pink-950 dark:text-pink-300';
      const genderIcon = isMale ? 'mars' : 'venus';

      const birthText = person.birth && person.birth.year ? `* ${person.birth.year}` : '';
      const deathText = person.death && person.death.year ? `† ${person.death.year}` : '';
      const datesFormatted = [birthText, deathText].filter(Boolean).join(' ');

      card.innerHTML = `
        <div class="flex items-start justify-between">
          <div class="truncate pr-1">
            <div class="font-bold text-sm text-slate-900 dark:text-slate-100 truncate">${person.givenName || ''} ${person.surname || ''}</div>
            <div class="text-xs text-slate-500 dark:text-slate-400 font-medium">${datesFormatted || '---'}</div>
          </div>
          <span class="p-1 rounded-md text-xs ${genderBg} shrink-0">
            <i data-lucide="${genderIcon}" class="w-3.5 h-3.5"></i>
          </span>
        </div>
        <div class="flex items-center justify-between text-[10px] text-slate-400 border-t border-slate-100 dark:border-slate-700/50 pt-1 mt-1">
          <span>${isRoot ? '★ Hlavní osoba' : 'Klikněte pro editaci'}</span>
          ${!isRoot ? `<button onclick="setAsRoot(event, '${person.id}')" title="Nastavit jako středovou osobu" class="hover:text-brand-500"><i data-lucide="target" class="w-3 h-3"></i></button>` : ''}
        </div>
      `;

      card.onclick = (e) => {
        e.stopPropagation();
        openSidebar(person.id);
      };

      return card;
    }

    // Set Root Person for Hourglass focus
    function setAsRoot(e, id) {
      e.stopPropagation();
      rootPersonId = id;
      renderTree();
      centerOnRoot();
    }

    // --- SIDEBAR & FORM EDITING WITH CZECH DATES ---
    function openSidebar(id) {
      selectedPersonId = id;
      const person = people[id];
      if (!person) return;

      document.getElementById('edit-id').value = id;
      document.getElementById('edit-givenName').value = person.givenName || '';
      document.getElementById('edit-surname').value = person.surname || '';
      
      setEditGender(person.sex || 'M');

      // Populate Czech Birth Dates
      document.getElementById('edit-birth-day').value = person.birth?.day || '';
      document.getElementById('edit-birth-month').value = person.birth?.month || '';
      document.getElementById('edit-birth-year').value = person.birth?.year || '';
      document.getElementById('edit-birth-place').value = person.birth?.place || '';

      // Populate Czech Death Dates
      document.getElementById('edit-death-day').value = person.death?.day || '';
      document.getElementById('edit-death-month').value = person.death?.month || '';
      document.getElementById('edit-death-year').value = person.death?.year || '';
      document.getElementById('edit-death-place').value = person.death?.place || '';

      // Update Spouse Button Label based on current gender
      updateSpouseButtonText(person.sex || 'M');

      const sidebar = document.getElementById('edit-sidebar');
      sidebar.classList.remove('translate-x-full');
    }

    function closeSidebar() {
      const sidebar = document.getElementById('edit-sidebar');
      sidebar.classList.add('translate-x-full');
      selectedPersonId = null;
    }

    function setEditGender(gender) {
      const btnM = document.getElementById('btn-gender-M');
      const btnF = document.getElementById('btn-gender-F');

      if (gender === 'M') {
        btnM.className = 'py-2 px-3 border rounded-lg text-sm font-medium flex items-center justify-center space-x-2 bg-blue-50 border-blue-300 text-blue-700 dark:bg-blue-950 dark:border-blue-700 dark:text-blue-200';
        btnF.className = 'py-2 px-3 border rounded-lg text-sm font-medium flex items-center justify-center space-x-2 bg-slate-50 border-slate-200 text-slate-600 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-400';
      } else {
        btnF.className = 'py-2 px-3 border rounded-lg text-sm font-medium flex items-center justify-center space-x-2 bg-pink-50 border-pink-300 text-pink-700 dark:bg-pink-950 dark:border-pink-700 dark:text-pink-200';
        btnM.className = 'py-2 px-3 border rounded-lg text-sm font-medium flex items-center justify-center space-x-2 bg-slate-50 border-slate-200 text-slate-600 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-400';
      }
      btnM.dataset.selected = (gender === 'M');
      btnF.dataset.selected = (gender === 'F');

      updateSpouseButtonText(gender);
    }

    function updateSpouseButtonText(gender) {
      const spouseText = document.getElementById('btn-add-spouse-text');
      spouseText.textContent = gender === 'F' ? 'Přidat manžela' : 'Přidat manželku';
    }

    function savePersonChanges() {
      if (!selectedPersonId || !people[selectedPersonId]) return;

      const person = people[selectedPersonId];
      person.givenName = document.getElementById('edit-givenName').value.trim();
      person.surname = document.getElementById('edit-surname').value.trim();
      person.sex = document.getElementById('btn-gender-M').dataset.selected === 'true' ? 'M' : 'F';

      // Parse Czech Birth Date
      person.birth = {
        day: parseInt(document.getElementById('edit-birth-day').value) || null,
        month: parseInt(document.getElementById('edit-birth-month').value) || null,
        year: parseInt(document.getElementById('edit-birth-year').value) || null,
        place: document.getElementById('edit-birth-place').value.trim()
      };

      // Parse Czech Death Date
      person.death = {
        day: parseInt(document.getElementById('edit-death-day').value) || null,
        month: parseInt(document.getElementById('edit-death-month').value) || null,
        year: parseInt(document.getElementById('edit-death-year').value) || null,
        place: document.getElementById('edit-death-place').value.trim()
      };

      renderTree();
      closeSidebar();
    }

    // --- MANAGE SPOUSE & PARENTS ---
    function addSpouseToCurrent() {
      if (!selectedPersonId) return;
      const current = people[selectedPersonId];
      const newSpouseSex = current.sex === 'M' ? 'F' : 'M';
      
      const newSpouseId = 'I' + (Object.keys(people).length + 1);
      const newFamId = 'F' + (Object.keys(families).length + 1);

      people[newSpouseId] = {
        id: newSpouseId,
        givenName: newSpouseSex === 'F' ? 'Nová' : 'Nový',
        surname: current.surname || 'Partner',
        sex: newSpouseSex,
        birth: {},
        death: {},
        fams: [newFamId]
      };

      if (!current.fams) current.fams = [];
      current.fams.push(newFamId);

      families[newFamId] = {
        id: newFamId,
        husb: current.sex === 'M' ? current.id : newSpouseId,
        wife: current.sex === 'F' ? current.id : newSpouseId,
        chil: []
      };

      renderTree();
      openSidebar(newSpouseId);
    }

    function addParentToCurrent(sex) {
      if (!selectedPersonId) return;
      const child = people[selectedPersonId];
      
      let fam = child.famc ? families[child.famc] : null;

      if (!fam) {
        const newFamId = 'F' + (Object.keys(families).length + 1);
        fam = { id: newFamId, husb: null, wife: null, chil: [child.id] };
        families[newFamId] = fam;
        child.famc = newFamId;
      }

      const parentId = 'I' + (Object.keys(people).length + 1);
      people[parentId] = {
        id: parentId,
        givenName: sex === 'M' ? 'Otec' : 'Matka',
        surname: child.surname || '',
        sex: sex,
        birth: {},
        death: {},
        fams: [fam.id]
      };

      if (sex === 'M') {
        fam.husb = parentId;
      } else {
        fam.wife = parentId;
      }

      renderTree();
      openSidebar(parentId);
    }

    function addNewPerson() {
      const newId = 'I' + (Object.keys(people).length + 1);
      people[newId] = {
        id: newId,
        givenName: 'Nová',
        surname: 'Osoba',
        sex: 'M',
        birth: {},
        death: {}
      };
      rootPersonId = newId;
      renderTree();
      openSidebar(newId);
    }

    function deletePerson() {
      if (!selectedPersonId) return;
      if (Object.keys(people).length <= 1) {
        alert('Nelze smazat jedinou osobu v rodokmenu.');
        return;
      }

      const id = selectedPersonId;
      delete people[id];

      // Clean family references
      Object.values(families).forEach(fam => {
        if (fam.husb === id) fam.husb = null;
        if (fam.wife === id) fam.wife = null;
        fam.chil = (fam.chil || []).filter(cId => cId !== id);
      });

      if (rootPersonId === id) {
        rootPersonId = Object.keys(people)[0];
      }

      closeSidebar();
      renderTree();
    }

    // --- GEDCOM IMPORT / EXPORT WITH AUTOMATIC CZECH DATE CONVERSION ---

    function parseGedcomDate(dateStr) {
      if (!dateStr) return {};
      const parts = dateStr.trim().split(/\s+/);
      let day = null, month = null, year = null;

      parts.forEach(p => {
        if (/^\d{1,2}$/.test(p)) {
          day = parseInt(p);
        } else if (/^\d{4}$/.test(p)) {
          year = parseInt(p);
        } else {
          const upperP = p.toUpperCase();
          const matchMonth = CZECH_MONTHS.find(m => m.gedcom === upperP);
          if (matchMonth) {
            month = matchMonth.num;
          }
        }
      });

      return { day, month, year };
    }

    function formatGedcomDate(dateObj) {
      if (!dateObj) return '';
      const parts = [];
      if (dateObj.day) parts.push(dateObj.day);
      if (dateObj.month) {
        const m = CZECH_MONTHS.find(item => item.num === dateObj.month);
        if (m) parts.push(m.gedcom);
      }
      if (dateObj.year) parts.push(dateObj.year);
      return parts.join(' ');
    }

    function handleGedcomImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        parseGedcomContent(e.target.result);
      };
      reader.readAsText(file);
    }

    function parseGedcomContent(text) {
      const lines = text.split(/\r?\n/);
      const newPeople = {};
      const newFamilies = {};

      let currentObj = null;
      let currentType = null; // 'INDI' or 'FAM'
      let currentSubContext = null; // 'BIRT' or 'DEAT'

      lines.forEach(line => {
        const match = line.trim().match(/^(\d+)\s+(@\w+@|\w+)?\s*(.*)$/);
        if (!match) return;

        const level = parseInt(match[1]);
        const tagOrId = match[2];
        const value = match[3];

        if (level === 0) {
          if (value === 'INDI') {
            currentType = 'INDI';
            const id = tagOrId.replace(/@/g, '');
            currentObj = { id: id, birth: {}, death: {}, fams: [] };
            newPeople[id] = currentObj;
          } else if (value === 'FAM') {
            currentType = 'FAM';
            const id = tagOrId.replace(/@/g, '');
            currentObj = { id: id, chil: [] };
            newFamilies[id] = currentObj;
          } else {
            currentType = null;
          }
        } else if (currentObj && currentType === 'INDI') {
          if (tagOrId === 'NAME') {
            const nameParts = value.split('/');
            currentObj.givenName = nameParts[0] ? nameParts[0].trim() : '';
            currentObj.surname = nameParts[1] ? nameParts[1].trim() : '';
          } else if (tagOrId === 'SEX') {
            currentObj.sex = value.toUpperCase() === 'F' ? 'F' : 'M';
          } else if (tagOrId === 'BIRT') {
            currentSubContext = 'BIRT';
          } else if (tagOrId === 'DEAT') {
            currentSubContext = 'DEAT';
          } else if (tagOrId === 'DATE') {
            const parsedDate = parseGedcomDate(value);
            if (currentSubContext === 'BIRT') currentObj.birth = { ...currentObj.birth, ...parsedDate };
            if (currentSubContext === 'DEAT') currentObj.death = { ...currentObj.death, ...parsedDate };
          } else if (tagOrId === 'PLAC') {
            if (currentSubContext === 'BIRT') currentObj.birth.place = value;
            if (currentSubContext === 'DEAT') currentObj.death.place = value;
          } else if (tagOrId === 'FAMC') {
            currentObj.famc = value.replace(/@/g, '');
          } else if (tagOrId === 'FAMS') {
            currentObj.fams.push(value.replace(/@/g, ''));
          }
        } else if (currentObj && currentType === 'FAM') {
          if (tagOrId === 'HUSB') currentObj.husb = value.replace(/@/g, '');
          if (tagOrId === 'WIFE') currentObj.wife = value.replace(/@/g, '');
          if (tagOrId === 'CHIL') currentObj.chil.push(value.replace(/@/g, ''));
        }
      });

      if (Object.keys(newPeople).length > 0) {
        people = newPeople;
        families = newFamilies;
        rootPersonId = Object.keys(people)[0];
        renderTree();
        centerOnRoot();
      }
    }

    function exportGedcom() {
      let gedcom = "0 HEAD\n1 SOUR RodokmenApp\n1 GEDC\n2 VERS 5.5\n2 FORM LINEAGE-LINKED\n1 CHAR UTF-8\n";

      Object.values(people).forEach(p => {
        gedcom += `0 @${p.id}@ INDI\n`;
        gedcom += `1 NAME ${p.givenName || ''} /${p.surname || ''}/\n`;
        if (p.sex) gedcom += `1 SEX ${p.sex}\n`;
        
        if (p.birth && (p.birth.year || p.birth.place)) {
          gedcom += `1 BIRT\n`;
          const bDate = formatGedcomDate(p.birth);
          if (bDate) gedcom += `2 DATE ${bDate}\n`;
          if (p.birth.place) gedcom += `2 PLAC ${p.birth.place}\n`;
        }

        if (p.death && (p.death.year || p.death.place)) {
          gedcom += `1 DEAT\n`;
          const dDate = formatGedcomDate(p.death);
          if (dDate) gedcom += `2 DATE ${dDate}\n`;
          if (p.death.place) gedcom += `2 PLAC ${p.death.place}\n`;
        }

        if (p.famc) gedcom += `1 FAMC @${p.famc}@\n`;
        if (p.fams) p.fams.forEach(fId => gedcom += `1 FAMS @${fId}@\n`);
      });

      Object.values(families).forEach(f => {
        gedcom += `0 @${f.id}@ FAM\n`;
        if (f.husb) gedcom += `1 HUSB @${f.husb}@\n`;
        if (f.wife) gedcom += `1 WIFE @${f.wife}@\n`;
        if (f.chil) f.chil.forEach(cId => gedcom += `1 CHIL @${cId}@\n`);
      });

      gedcom += "0 TLR\n";

      const blob = new Blob([gedcom], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'rodokmen_export.ged';
      link.click();
    }

    // --- EXPORT TO VECTOR SVG FOR PRINT ---
    function exportSVG() {
      const svgElement = document.getElementById('svg-tree');
      const nodesElement = document.getElementById('tree-nodes');

      const cloneSvg = svgElement.cloneNode(true);
      cloneSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

      // Convert HTML Node Cards into SVG ForeignObjects or SVG rects/text for pristine printing
      const nodeCards = nodesElement.querySelectorAll('.node-card');
      nodeCards.forEach(card => {
        const transform = card.style.transform;
        const match = transform.match(/translate\(([^px]+)px,\s*([^px]+)px\)/);
        if (!match) return;

        const x = parseFloat(match[1]);
        const y = parseFloat(match[2]);

        const fo = document.createElementNS('http://www.w3.org/2000/svg', 'foreignObject');
        fo.setAttribute('x', x);
        fo.setAttribute('y', y);
        fo.setAttribute('width', NODE_WIDTH);
        fo.setAttribute('height', NODE_HEIGHT);

        const cardClone = card.cloneNode(true);
        cardClone.style.transform = '';
        fo.appendChild(cardClone);

        cloneSvg.appendChild(fo);
      });

      const svgData = new XMLSerializer().serializeToString(cloneSvg);
      const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'rodokmen_plakat.svg';
      link.click();
    }

    // --- POSTER STYLE & DARK MODE TOGGLES ---
    function togglePosterStyle() {
      isPosterMode = !isPosterMode;
      const container = document.getElementById('canvas-container');
      const btn = document.getElementById('poster-btn');

      if (isPosterMode) {
        container.classList.add('poster-theme');
        btn.classList.add('ring-2', 'ring-amber-500');
      } else {
        container.classList.remove('poster-theme');
        btn.classList.remove('ring-2', 'ring-amber-500');
      }
      renderTree();
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }

    // --- PAN & ZOOM INTERACTION ---
    let isPanning = false;
    let startX, startY, scrollLeft, scrollTop;

    function setupPanZoom() {
      const container = document.getElementById('canvas-container');

      container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node-card')) return;
        isPanning = true;
        startX = e.pageX - container.offsetLeft;
        startY = e.pageY - container.offsetTop;
        scrollLeft = container.scrollLeft;
        scrollTop = container.scrollTop;
      });

      container.addEventListener('mouseleave', () => isPanning = false);
      container.addEventListener('mouseup', () => isPanning = false);

      container.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        const x = e.pageX - container.offsetLeft;
        const y = e.pageY - container.offsetTop;
        const walkX = (x - startX) * 1.5;
        const walkY = (y - startY) * 1.5;
        container.scrollLeft = scrollLeft - walkX;
        container.scrollTop = scrollTop - walkY;
      });

      centerOnRoot();
    }

    function centerOnRoot() {
      const container = document.getElementById('canvas-container');
      container.scrollLeft = (3000 / 2) - (container.clientWidth / 2);
      container.scrollTop = (3000 / 2) - (container.clientHeight / 2);
    }
  </script>
